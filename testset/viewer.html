<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reviewer's desk. Left rail = the procedure (steps), main = the dossier as a stack of
   paper documents; a header strip switches case and toggles the labels on or off. */
:root {
  --bg: #f3f2ee;          /* warm paper grey */
  --surface: #ffffff;
  --surface-2: #e9e7e0;
  --fg: #1d1f24;
  --muted: #5f6470;
  --line: #d6d3ca;
  --accent: #b5262a;      /* federal red, desaturated */
  --accent-soft: #f6e3e3;
  --ok: #2b7a4b;  --ok-soft: #dff0e5;
  --trap: #a35a00; --trap-soft: #fbe9d0;
  --absent: #4b4f9e; --absent-soft: #e4e4f5;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-doc: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17181c; --surface: #202229; --surface-2: #2a2d35; --fg: #e8e6e0; --muted: #a2a6b0; --line: #3a3d47;
  --accent: #e0585b; --accent-soft: #3a2426; --ok: #6cc08d; --ok-soft: #1f3528; --trap: #e3a24a; --trap-soft: #3b2d17;
  --absent: #9b9ee6; --absent-soft: #272848; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17181c; --surface: #202229; --surface-2: #2a2d35; --fg: #e8e6e0; --muted: #a2a6b0; --line: #3a3d47;
  --accent: #e0585b; --accent-soft: #3a2426; --ok: #6cc08d; --ok-soft: #1f3528; --trap: #e3a24a; --trap-soft: #3b2d17;
  --absent: #9b9ee6; --absent-soft: #272848; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; margin: 0; }
.wrap { padding-inline: 16px; padding-block: 12px 48px; max-width: 1400px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: 20px; letter-spacing: -0.01em; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.topbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding-block: 10px 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.topbar .grow { flex: 1 1 260px; min-width: 0; }
select, button { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; font-variant-numeric: tabular-nums; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; }

.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

/* steps rail */
.rail { min-width: 0; }
.rail h2 { font-size: 13px; margin-bottom: 8px; }
.steps { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--line); margin-left: 8px; }
.step { position: relative; padding: 8px 10px 8px 18px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; color: var(--fg); border-radius: 0 6px 6px 0; }
.step::before { content: ""; position: absolute; left: -7px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); }
.step:hover { background: var(--surface-2); }
.step.active { background: var(--accent-soft); }
.step.active::before { border-color: var(--accent); background: var(--accent); }
.step .code { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.step .date { font-family: var(--font-mono); font-size: 12px; }
.step .act { font-size: 13px; margin-top: 2px; }
.step.all { margin-bottom: 6px; font-weight: 500; }
.absent { margin-top: 18px; padding: 12px; border: 1px dashed var(--absent); border-radius: 8px; background: var(--absent-soft); }
.absent h3 { font-size: 13px; color: var(--absent); margin-bottom: 4px; }
.absent p { margin: 4px 0; font-size: 13px; }

/* question panel */
.question { padding: 12px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; }
.question h2 { font-size: 14px; margin-bottom: 6px; }
.question dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
.question dt { color: var(--muted); }
.question dd { margin: 0; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
.pill.use { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pill.refuse { background: var(--trap-soft); border-color: var(--trap); color: var(--trap); }

/* documents */
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
@media (max-width: 420px) { .docs { grid-template-columns: 1fr; } }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px 12px; min-width: 0; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 0 var(--line); }
.doc.is-trap.labels { border-color: var(--trap); }
.doc.is-real.labels { border-color: var(--ok); }
.doc.dim { opacity: 0.45; }
.doc .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.doc .id { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.badge.real { background: var(--ok-soft); color: var(--ok); }
.badge.trap { background: var(--trap-soft); color: var(--trap); }
.badge.use { background: var(--ok-soft); color: var(--ok); }
.badge.refuse { background: var(--trap-soft); color: var(--trap); }
.doc h3 { font-family: var(--font-doc); font-size: 15px; font-weight: 500; line-height: 1.3; }
.doc .meta { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; }
.doc .meta span:nth-child(odd) { text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
.doc .body { font-family: var(--font-doc); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; max-height: 9.5em; overflow: hidden; position: relative; }
.doc .body.open { max-height: none; }
.doc .body:not(.open)::after { content: ""; position: absolute; inset: auto 0 0 0; height: 2.5em; background: linear-gradient(transparent, var(--surface)); }
.doc .more { align-self: flex-start; font-size: 12px; padding: 3px 8px; }
.doc .truth { font-size: 12.5px; padding: 8px 10px; border-radius: 4px; background: var(--surface-2); }
.doc .truth b { font-weight: 600; }
.doc .truth .src { font-style: italic; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin: 6px 0 14px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend .l-real::before { background: var(--ok); } .legend .l-trap::before { background: var(--trap); } .legend .l-absent::before { background: var(--absent); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .doc .body { transition: max-height 0.2s ease; } }
</style>

<script id="data" type="application/json">{"4A_283/2025": {"case_id": "4A_283/2025", "language": "de", "domain": "PRIV_VVG", "outcome": "partial_approval", "steps": [{"code": "S3_pre_decision", "date": "2023-08-17", "actor": "insurer", "act": "Die Beklagte als Unfallversicherung teilt dem Kläger mit, die aktuellen Beschwerden und Befunde stünden mit überwiegender Wahrscheinlichkeit nicht in natürlichem Kausalzusammenhang mit dem Unfallereignis vom 7. Oktober 2022.", "deadline_rule": null}, {"code": "S1_claim", "date": "2023-08-18", "actor": "employer", "act": "Die Arbeitgeberin meldet der Beklagten mit Schadenmeldung eine krankheitsbedingte Arbeitsunfähigkeit des Klägers ab dem 1. August 2023 (Krankentaggeldversicherung).", "deadline_rule": null}, {"code": "S2_inquiry", "date": "2023-08-28", "actor": "insurer", "act": "Die Beklagte bestätigt dem Kläger den Eingang der Meldung und teilt mit, er werde im Rahmen der kollektiven Krankentaggeldversicherung begleitet; die Arbeitgeberin meldet am selben Tag die Auflösung des Arbeitsverhältnisses per 31. Juli 2023.", "deadline_rule": null}, {"code": "S4_decision", "date": "2023-10-18", "actor": "insurer", "act": "Die Beklagte stellt gestützt auf die versicherungsmedizinische Beurteilung vom 5. Oktober 2023 die Unfallleistungen per 31. Juli 2023 ein (Verfügung).", "deadline_rule": "30 Tage ab Eröffnung für die Einsprache, Art. 52 und Art. 60 ATSG"}, {"code": "S4_decision", "date": "2023-11-14", "actor": "insurer", "act": "Die Beklagte teilt dem Kläger mit, ab dem 1. August 2023 bestehe in der Krankentaggeldversicherung wegen Ziffer 16.2 AVB kein Leistungsanspruch, und verneint einen Übertritt in die Einzelversicherung wegen Wohnsitzes in Deutschland.", "deadline_rule": null}, {"code": "S5_objection", "date": null, "actor": "insured", "act": "Der Kläger erhebt gegen die Verfügung vom 18. Oktober 2023 Einsprache.", "deadline_rule": "30 Tage ab Eröffnung der Verfügung, Art. 52 Abs. 1 und Art. 60 ATSG"}, {"code": "S5_objection", "date": "2024-01-26", "actor": "insurer", "act": "Die Beklagte weist die Einsprache mit Einspracheentscheid ab.", "deadline_rule": "30 Tage ab Eröffnung für die Beschwerde, Art. 56 und Art. 60 ATSG"}, {"code": "S4_decision", "date": "2024-04-05", "actor": "insurer", "act": "Die Beklagte hält mit Schreiben an ihrer Leistungsablehnung in der Krankentaggeldversicherung fest.", "deadline_rule": null}, {"code": "S6_cantonal_appeal", "date": "2024-05-29", "actor": "insured", "act": "Der Kläger erhebt beim Sozialversicherungsgericht des Kantons Basel-Stadt Klage auf Krankentaggeld von Fr. 146.85 pro Tag vom 1. August 2023 bis 31. Mai 2024 nebst Zins.", "deadline_rule": null}, {"code": "S6b_cantonal_judgment", "date": "2025-01-30", "actor": "cantonal_court", "act": "Das Sozialversicherungsgericht weist die Klage ab; die krankheitsbedingte Arbeitsunfähigkeit habe am 1. August 2023 begonnen, als keine Versicherungsdeckung mehr bestanden habe.", "deadline_rule": "30 Tage ab Eröffnung für die Beschwerde in Zivilsachen, Art. 100 Abs. 1 BGG"}, {"code": "S7_federal_appeal", "date": null, "actor": "insured", "act": "Der Kläger erhebt Beschwerde in Zivilsachen beim Bundesgericht und beantragt Aufhebung des Urteils sowie Krankentaggeld für die Zeit vom 1. August 2023 bis 29. November 2024 (Fr. 71'515.95) nebst Zins; Beklagte und Sozialversicherungsgericht beantragen Abweisung.", "deadline_rule": "30 Tage ab Eröffnung des Urteils, Art. 100 Abs. 1 BGG"}], "documents": [{"doc_id": "D01", "type": "judgment", "title": "Urteil des Sozialversicherungsgerichts", "author": "Sozialversicherungsgericht des Kantons Basel-Stadt", "recipient": "A.________; B.________ AG", "date": "2025-01-30", "reference": "KK.2024.18", "body": "Sozialversicherungsgericht des Kantons Basel-Stadt\nUrteil vom 30. Januar 2025\nIn Sachen A.________, Kläger, gegen B.________ AG, Beklagte, betreffend Krankentaggeld.\nSachverhalt: Der Kläger arbeitete ab dem 20. September 2021 bei der C.________ AG und war über diese bei der Beklagten kollektiv krankentaggeldversichert. Am 7. Oktober 2022 erlitt er einen Unfall. Die Arbeitgeberin kündigte das Arbeitsverhältnis am 26. Mai 2023 auf den 31. Juli 2023. Mit Klage vom 29. Mai 2024 beantragte der Kläger, die Beklagte sei zu verpflichten, ihm für die Zeit vom 1. August 2023 bis 31. Mai 2024 ein Krankentaggeld von Fr. 146.85 pro Tag (Fr. 44'789.25) nebst Zins auszurichten.\nErwägungen: Der Zeitpunkt, an dem die krankheitsbedingte Arbeitsunfähigkeit begonnen hat, fällt auf den 1. August 2023. In diesem Zeitpunkt bestand keine Versicherungsdeckung mehr.\nDemgemäss erkennt das Sozialversicherungsgericht: Die Klage wird abgewiesen.\nRechtsmittelbelehrung: Gegen dieses Urteil kann innert 30 Tagen seit Eröffnung beim Bundesgericht, 1000 Lausanne 14, Beschwerde in Zivilsachen erhoben werden (Art. 72 ff., Art. 100 Abs. 1 BGG).\nIm Namen des Sozialversicherungsgerichts, die Präsidentin / die Gerichtsschreiberin", "ground_truth": {"status": "real", "step_created": "S6b_cantonal_judgment", "use_at_steps": ["S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Urteil vom 30. Januar 2025 wies das Sozialversicherungsgericht die Klage ab. Es erwog, der Zeitpunkt, an dem die krankheitsbedingte Arbeitsunfähigkeit begonnen habe, falle auf den 1. August 2023."}}, {"doc_id": "D02", "type": "objection", "title": "Einsprache gegen das Schreiben vom 14. November 2023", "author": "A.________", "recipient": "B.________ AG, Leistungsabteilung Krankentaggeld, ____", "date": "2023-12-01", "reference": "Schaden-Nr. KT-2023-____", "body": "A.________\n____\n____ (Deutschland)\n\nB.________ AG\nLeistungsabteilung Krankentaggeld\n____\n\n____, 1. Dezember 2023\n\nEinsprache gegen das Schreiben vom 14. November 2023 betreffend Krankentaggeld\n\nSehr geehrte Damen und Herren\n\nMit Schreiben vom 14. November 2023 teilten Sie mir mit, die Unfallversicherung habe die Unfallleistungen per 31. Juli 2023 eingestellt und ein Krankheitsfall sei per 1. August 2023 angelegt worden. Gestützt auf Ziffer 16.2 Ihrer Allgemeinen Versicherungsbedingungen ende der Versicherungsschutz bei Beendigung des Arbeitsvertrags, weshalb ab dem 1. August 2023 kein Leistungsanspruch bestehe. Da ich in Deutschland wohne, hätte ich keinen Anspruch auf Übertritt in die Einzelversicherung.\n\nHiermit erhebe ich Einsprache gegen diese Mitteilung und beantrage, mir ab dem 1. August 2023 das versicherte Krankentaggeld auszurichten. Ich bitte Sie, die Leistungsablehnung zu überprüfen und mir einen anfechtbaren Entscheid zuzustellen. Eine nähere Begründung behalte ich mir vor.\n\nFreundliche Grüsse\n\n\n______________________\nA.________", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": [], "trap_type": "T3_unsent", "trap_note": "Die Einsprache trägt keine Unterschrift, keine Einschreibenummer und keinen Eingangsstempel der Beklagten, und im weiteren Verfahren wird nur die Einsprache gegen die Verfügung vom 18. Oktober 2023 erwähnt; sie wurde nie eingereicht.", "source_sentence": null}}, {"doc_id": "D03", "type": "decision", "title": "Verfügung betreffend Einstellung der Unfallversicherungsleistungen", "author": "B.________ AG, Unfallversicherung", "recipient": "A.________", "date": "2023-10-18", "reference": "Unfall-Nr. UV-2022-____ / Verfügung", "body": "B.________ AG, Unfallversicherung\n____\n\nEinschreiben\nA.________\n____\n\n____, 18. Oktober 2023\n\nVerfügung\nVersicherter: A.________; Ereignis vom 7. Oktober 2022\n\nGestützt auf die versicherungsmedizinische Beurteilung vom 5. Oktober 2023 von Dr. med. D.________, Facharzt für Chirurgie FMH, verfügen wir:\n\nAufgrund des fehlenden Nachweises einer frischen, unfallbedingten strukturellen Verletzung ist von einer Prellung bzw. Stauchung der Brust- und/oder Lendenwirbelsäule auszugehen. Die maximale Behandlungsdauer beträgt sechs Wochen, womit der Status quo sine spätestens Ende November 2022 erreicht ist. Die gesundheitlichen Beschwerden am Rücken sind demnach nicht mehr mit überwiegender Wahrscheinlichkeit auf das Ereignis vom 7. Oktober 2022 zurückzuführen.\n\nDie Leistungen (Taggeld und Heilbehandlung) werden per 31. Juli 2023 eingestellt.\n\nRechtsmittelbelehrung: Gegen diese Verfügung kann innert 30 Tagen seit Eröffnung bei der B.________ AG, ____, schriftlich Einsprache erhoben werden (Art. 52 und Art. 60 ATSG). Die Einsprache muss einen Antrag und eine Begründung enthalten.\n\nB.________ AG, Unfallversicherung", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S5_objection", "S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Verfügung vom 18. Oktober 2023 teilte sie ihm gestützt auf die versicherungsmedizinische Beurteilung vom 5. Oktober 2023 von Dr. med. D.________ (Facharzt für Chirurgie FMH) mit, [...] weshalb die Leistungen per 31. Juli 2023 eingestellt würden."}}, {"doc_id": "D04", "type": "letter", "title": "Stellungnahme zur Beschwerde in Zivilsachen", "author": "Sozialversicherungsgericht des Kantons Basel-Stadt", "recipient": "Schweizerisches Bundesgericht, I. zivilrechtliche Abteilung", "date": "2025-04-22", "reference": "KK.2024.18 / 4A_283/2025", "body": "Sozialversicherungsgericht des Kantons Basel-Stadt\n____\n\nSchweizerisches Bundesgericht\nI. zivilrechtliche Abteilung\n1000 Lausanne 14\n\n____, 22. April 2025\n\nBeschwerdeverfahren 4A_283/2025\nA.________ gegen B.________ AG, Krankentaggeld\n\nSehr geehrte Damen und Herren\n\nMit Verfügung des Instruktionsrichters wurde uns Gelegenheit gegeben, uns zur Beschwerde in Zivilsachen von A.________ zu äussern.\n\nDer Beschwerdeführer beantragt im Wesentlichen, unser Urteil vom 30. Januar 2025 sei aufzuheben und die Beschwerdegegnerin sei zu verpflichten, ihm für die Zeit vom 1. August 2023 bis und mit dem 29. November 2024 ein Krankentaggeld von Fr. 146.85 pro Tag (entsprechend Fr. 71'515.95) nebst Zins auszurichten.\n\nWir verweisen auf die Erwägungen unseres Urteils und beantragen die Abweisung der Beschwerde. Die kantonalen Akten haben wir beigelegt.\n\nFreundliche Grüsse\nSozialversicherungsgericht des Kantons Basel-Stadt\n\nDie Gerichtsschreiberin\n\nBeilage: kantonale Akten (KK.2024.18)", "ground_truth": {"status": "trap", "step_created": "S7_federal_appeal", "use_at_steps": [], "trap_type": "T1_future", "trap_note": "Das Dokument ist auf den 22. April 2025 datiert, also nach dem kantonalen Urteil vom 30. Januar 2025, und verweist auf ein Bundesgerichtsverfahren, das in früheren Schritten noch nicht existiert.", "source_sentence": null}}, {"doc_id": "D05", "type": "claim", "title": "Schadenmeldung Krankheit (Kollektiv-Krankentaggeldversicherung)", "author": "C.________ AG (Arbeitgeberin)", "recipient": "B.________ AG, Krankentaggeld", "date": "2023-08-18", "reference": "Police KT-____ / Schadenmeldung", "body": "C.________ AG\nPersonalabteilung\n____\n\nB.________ AG\nKollektiv-Krankentaggeldversicherung\n____\n\n____, 18. August 2023\n\nSchadenmeldung Krankheit\nPolice-Nr.: KT-____\nVersicherte Person: A.________, angestellt seit dem 20. September 2021\n\nWir melden Ihnen hiermit eine Arbeitsunfähigkeit des oben genannten Mitarbeiters wegen Krankheit ab dem 1. August 2023.\n\nAngaben zum Arbeitsverhältnis: Eintritt am 20. September 2021. Der Mitarbeiter ist bei Ihnen im Rahmen der kollektiven Krankentaggeldversicherung der C.________ AG versichert. Er ist zudem bei Ihnen obligatorisch unfallversichert; am 7. Oktober 2022 hat er einen Unfall erlitten, für den Ihre Unfallversicherung Leistungen erbracht hat.\n\nWir bitten Sie, den Eingang der Meldung zu bestätigen und das weitere Vorgehen mit dem Versicherten direkt zu klären.\n\nFreundliche Grüsse\n\nC.________ AG\nPersonalabteilung\n\nUnterschrift: ____", "ground_truth": {"status": "real", "step_created": "S1_claim", "use_at_steps": ["S2_inquiry", "S4_decision", "S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Schadenmeldung vom 18. August 2023 meldete die Arbeitgeberin eine Arbeitsunfähigkeit des Klägers wegen Krankheit ab dem 1. August 2023."}}, {"doc_id": "D06", "type": "letter", "title": "Schreiben betreffend Krankentaggeld ab 1. August 2023", "author": "B.________ AG, Krankentaggeld", "recipient": "A.________", "date": "2023-11-14", "reference": "Schaden-Nr. KT-2023-____", "body": "B.________ AG\nKrankentaggeld\n____\n\nA.________\n____\n____ (Deutschland)\n\n____, 14. November 2023\n\nIhre Krankentaggeldversicherung; Schaden-Nr. KT-2023-____\n\nSehr geehrter Herr A.________\n\nDie Unfallversicherung hat die Unfallleistungen per 31. Juli 2023 eingestellt. Per 1. August 2023 wurde ein Krankheitsfall angelegt. Ihre ehemalige Arbeitgeberin hat uns am 28. August 2023 mitgeteilt, dass das Arbeitsverhältnis per 31. Juli 2023 aufgelöst worden ist.\n\nGemäss Ziffer 16.2 unserer Allgemeinen Versicherungsbedingungen (AVB) endet der Versicherungsschutz bei Beendigung des Arbeitsvertrags. Ab dem 1. August 2023 besteht deshalb kein Leistungsanspruch.\n\nDa Sie in Deutschland wohnen, haben Sie zudem keinen Anspruch auf Übertritt in die Einzelversicherung.\n\nWir bedauern, Ihnen keinen anderen Bescheid geben zu können, und danken für Ihr Verständnis.\n\nFreundliche Grüsse\n\nB.________ AG\nKrankentaggeld\n\ni.V. ____          ____", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Am 14. November 2023 schrieb die Beklagte dem Kläger, die Unfallversicherung habe die Unfallleistungen per 31. Juli 2023 eingestellt. [...] Aufgrund Ziffer 16.2 ihrer Allgemeinen Versicherungsbedingungen (AVB) ende der Versicherungsschutz bei Beendigung des Arbeitsvertrags."}}, {"doc_id": "D07", "type": "statute_extract", "title": "Allgemeine Versicherungsbedingungen Kollektiv-Krankentaggeld, Ziffer 16 (Ausgabe 01.2025)", "author": "B.________ AG", "recipient": "Versicherte Personen", "date": "2025-01-01", "reference": "AVB KTG 01.2025 / Ziff. 16", "body": "B.________ AG\nAllgemeine Versicherungsbedingungen (AVB)\nKollektiv-Krankentaggeldversicherung nach VVG\nAusgabe 01.2025, gültig ab 1. Januar 2025\n\n16. Ende des Versicherungsschutzes\n\n16.1 Der Versicherungsschutz für die einzelne versicherte Person endet mit dem Austritt aus dem versicherten Personenkreis, spätestens mit dem Ende des Vertrags.\n\n16.2 Der Versicherungsschutz endet bei Beendigung des Arbeitsvertrags. Bei Eintritt der Arbeitsunfähigkeit vor Beendigung des Arbeitsvertrags besteht der Anspruch auf Taggeld für diesen Versicherungsfall nach Vertragsende im Rahmen der vereinbarten Leistungsdauer weiter.\n\n16.3 Personen mit Wohnsitz im Ausland haben keinen Anspruch auf Übertritt in die Einzelversicherung.\n\n16.4 Die Versicherungsnehmerin ist verpflichtet, der B.________ AG den Austritt der versicherten Person innert 30 Tagen schriftlich zu melden.\n\nDiese Bedingungen ersetzen die früheren Ausgaben. Für bereits eingetretene Versicherungsfälle gelten die zum Zeitpunkt des Eintritts anwendbaren Bestimmungen.\n\nB.________ AG, ____", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": [], "trap_type": "T5_wrong_law_version", "trap_note": "Es handelt sich um die AVB-Ausgabe 01.2025 mit geändertem Absatz 16.2 (Weitergeltung bei früherer Arbeitsunfähigkeit), die am 1. August 2023 nicht in Kraft war; die Beklagte stützte sich auf die damalige Fassung von Ziffer 16.2.", "source_sentence": null}}, {"doc_id": "D08", "type": "medical_report", "title": "Versicherungsmedizinische Beurteilung", "author": "Dr. med. D.________, Facharzt für Chirurgie FMH", "recipient": "B.________ AG, Unfallversicherung", "date": "2023-10-05", "reference": "Unfall-Nr. UV-2022-____ / VMB", "body": "Dr. med. D.________\nFacharzt für Chirurgie FMH\n____\n\nAn: B.________ AG, Unfallversicherung\n\n____, 5. Oktober 2023\n\nVersicherungsmedizinische Beurteilung (Aktenbeurteilung)\nVersicherter: A.________; Ereignis vom 7. Oktober 2022\n\nFragestellung: Natürlicher Kausalzusammenhang zwischen den aktuellen Rückenbeschwerden und dem Unfallereignis vom 7. Oktober 2022.\n\nBeurteilung: Es fehlt der Nachweis einer frischen, unfallbedingten strukturellen Verletzung. Es ist von einer Prellung bzw. Stauchung der Brust- und/oder Lendenwirbelsäule auszugehen. Die maximale Behandlungsdauer beträgt sechs Wochen. Der Status quo sine ist damit spätestens Ende November 2022 erreicht.\n\nSchlussfolgerung: Die gesundheitlichen Beschwerden am Rücken sind nicht mehr mit überwiegender Wahrscheinlichkeit auf das Ereignis vom 7. Oktober 2022 zurückzuführen.\n\nDiese Beurteilung beruht auf den mir zur Verfügung gestellten Akten; eine persönliche Untersuchung des Versicherten fand nicht statt.\n\nDr. med. D.________\nFacharzt für Chirurgie FMH", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S4_decision", "S5_objection", "S6_cantonal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "gestützt auf die versicherungsmedizinische Beurteilung vom 5. Oktober 2023 von Dr. med. D.________ (Facharzt für Chirurgie FMH) mit, aufgrund des fehlenden Nachweises einer frischen, unfallbedingten strukturellen Verletzung sei von einer Prellung bzw. Stauchung der Brust- und/oder Lendenwirbelsäule auszugehen."}}, {"doc_id": "D09", "type": "letter", "title": "Schreiben betreffend natürlichen Kausalzusammenhang", "author": "B.________ AG, Unfallversicherung", "recipient": "A.________", "date": "2023-08-17", "reference": "Unfall-Nr. UV-2022-____", "body": "B.________ AG\nUnfallversicherung\n____\n\nA.________\n____\n\n____, 17. August 2023\n\nUnfall vom 7. Oktober 2022; Unfall-Nr. UV-2022-____\n\nSehr geehrter Herr A.________\n\nSie haben am 7. Oktober 2022 einen Unfall erlitten. Wir haben als Unfallversicherung Taggeldleistungen erbracht und die Behandlungskosten übernommen.\n\nNach Prüfung der Akten teilen wir Ihnen mit, dass die aktuellen Beschwerden und Befunde mit überwiegender Wahrscheinlichkeit nicht in natürlichem Kausalzusammenhang mit dem Unfallereignis stehen.\n\nWir werden Ihnen unseren Entscheid zum weiteren Leistungsanspruch gesondert mitteilen. Für Rückfragen steht Ihnen Ihre Sachbearbeiterin gerne zur Verfügung.\n\nFreundliche Grüsse\n\nB.________ AG\nUnfallversicherung\n\ni.V. ____          ____", "ground_truth": {"status": "real", "step_created": "S3_pre_decision", "use_at_steps": ["S4_decision", "S5_objection"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Schreiben vom 17. August 2023 teilte die Beklagte dem Kläger mit, die aktuellen Beschwerden und Befunde stünden mit überwiegender Wahrscheinlichkeit nicht in natürlichem Kausalzusammenhang mit dem Unfallereignis."}}, {"doc_id": "D10", "type": "decision", "title": "Verfügung betreffend Einstellung der Unfallversicherungsleistungen", "author": "B.________ AG, Unfallversicherung", "recipient": "E.________", "date": "2023-10-18", "reference": "Unfall-Nr. UV-2022-____ / Verfügung", "body": "B.________ AG, Unfallversicherung\n____\n\nEinschreiben\nE.________\n(geb. 12.03.1979, AHV-Nr. 756.____.____.__)\n____\n\n____, 18. Oktober 2023\n\nVerfügung\nVersicherter: E.________; Unfallereignis vom 14. Oktober 2022\n\nGestützt auf die versicherungsmedizinische Beurteilung von Dr. med. D.________, Facharzt für Chirurgie FMH, verfügen wir:\n\nEine frische, unfallbedingte strukturelle Verletzung ist nicht nachgewiesen. Die Beschwerden stehen nicht mehr mit überwiegender Wahrscheinlichkeit im Zusammenhang mit dem Ereignis vom 14. Oktober 2022. Die Leistungen werden per 31. Juli 2023 eingestellt.\n\nRechtsmittelbelehrung: Gegen diese Verfügung kann innert 30 Tagen seit Eröffnung bei der B.________ AG, ____, schriftlich Einsprache erhoben werden (Art. 52 und Art. 60 ATSG). Die Einsprache muss einen Antrag und eine Begründung enthalten.\n\nB.________ AG, Unfallversicherung", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": [], "trap_type": "T4_wrong_person", "trap_note": "Die Verfügung betrifft E.________ (anderer Anfangsbuchstabe, Geburtsdatum 12.03.1979, andere AHV-Nummer, Unfallereignis 14. Oktober 2022) und nicht den Kläger A.________ (Ereignis 7. Oktober 2022).", "source_sentence": null}}, {"doc_id": "D11", "type": "appeal", "title": "Klage auf Krankentaggeld", "author": "A.________", "recipient": "Sozialversicherungsgericht des Kantons Basel-Stadt", "date": "2024-05-29", "reference": "KK.2024.18", "body": "A.________\n____\n____ (Deutschland)\n\nSozialversicherungsgericht des Kantons Basel-Stadt\n____\n\n____, 29. Mai 2024\n\nKlage\n\nin Sachen A.________, Kläger,\ngegen B.________ AG, Beklagte,\nbetreffend Krankentaggeld\n\nRechtsbegehren:\n1. Die Beklagte sei zu verpflichten, dem Kläger für die Zeit vom 1. August 2023 bis und mit 31. Mai 2024 ein Krankentaggeld in der Höhe von Fr. 146.85 pro Tag (entsprechend Fr. 44'789.25) nebst Zins auszurichten.\n2. Die Beklagte sei zu verpflichten, dem Kläger bei Nachweis einer über den 31. Mai 2024 andauernden Arbeitsunfähigkeit die Taggeldleistungen für jeden weiteren Krankheitstag auszurichten.\n\nBegründung:\nDer Kläger arbeitete ab dem 20. September 2021 bei der C.________ AG und war dadurch bei der Beklagten kollektiv krankentaggeldversichert. Die Beklagte hat mit Schreiben vom 14. November 2023 und vom 5. April 2024 Leistungen ab dem 1. August 2023 abgelehnt. Der Kläger macht geltend, ihm stehe das Krankentaggeld ab dem 1. August 2023 zu. Weitere Ausführungen bleiben vorbehalten.\n\nA.________", "ground_truth": {"status": "real", "step_created": "S6_cantonal_appeal", "use_at_steps": ["S6b_cantonal_judgment", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Klage vom 29. Mai 2024 beantragte der Kläger beim Sozialversicherungsgericht des Kantons Basel-Stadt, die Beklagte sei zu verpflichten, ihm für die Zeit vom 1. August 2023 bis und mit 31. Mai 2024 ein Krankentaggeld in der Höhe von Fr. 146.85 pro Tag (entsprechend Fr. 44'789.25) nebst Zins auszurichten."}}, {"doc_id": "D12", "type": "decision", "title": "Einspracheentscheid", "author": "B.________ AG, Unfallversicherung", "recipient": "A.________", "date": "2024-01-26", "reference": "Unfall-Nr. UV-2022-____ / Einsprache", "body": "B.________ AG, Unfallversicherung\n____\n\nEinschreiben\nA.________\n____\n\n____, 26. Januar 2024\n\nEinspracheentscheid\nVersicherter: A.________; Ereignis vom 7. Oktober 2022\n\nGegenstand: Einsprache gegen die Verfügung vom 18. Oktober 2023\n\nMit Verfügung vom 18. Oktober 2023 haben wir gestützt auf die versicherungsmedizinische Beurteilung vom 5. Oktober 2023 von Dr. med. D.________ die Leistungen per 31. Juli 2023 eingestellt. Der Versicherte hat dagegen Einsprache erhoben.\n\nWir haben die Einsprache geprüft und halten an unserer Beurteilung fest. Es fehlt der Nachweis einer frischen, unfallbedingten strukturellen Verletzung; von einer Prellung bzw. Stauchung der Brust- und/oder Lendenwirbelsäule ist auszugehen. Die maximale Behandlungsdauer beträgt sechs Wochen, der Status quo sine war spätestens Ende November 2022 erreicht.\n\nEntscheid: Die Einsprache wird abgewiesen.\n\nRechtsmittelbelehrung: Gegen diesen Entscheid kann innert 30 Tagen seit Eröffnung beim zuständigen kantonalen Versicherungsgericht schriftlich Beschwerde erhoben werden (Art. 56 und Art. 60 ATSG). Die Beschwerdeschrift muss einen Antrag und eine Begründung enthalten.\n\nB.________ AG, Unfallversicherung", "ground_truth": {"status": "real", "step_created": "S5_objection", "use_at_steps": ["S6_cantonal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Einspracheentscheid vom 26. Januar 2024 wies die Beklagte die gegen die Verfügung vom 18. Oktober 2023 erhobene Einsprache ab."}}, {"doc_id": "D13", "type": "medical_report", "title": "Versicherungsmedizinische Beurteilung", "author": "Dr. med. D.________, Facharzt für Chirurgie FMH", "recipient": "B.________ AG, Unfallversicherung", "date": "2023-09-28", "reference": "Unfall-Nr. UV-2022-____ / VMB", "body": "Dr. med. D.________\nFacharzt für Chirurgie FMH\n____\n\nAn: B.________ AG, Unfallversicherung\n\n____, 28. September 2023\n\nVersicherungsmedizinische Beurteilung (Aktenbeurteilung)\nVersicherter: A.________; Ereignis vom 7. Oktober 2022\n\nFragestellung: Natürlicher Kausalzusammenhang zwischen den aktuellen Rückenbeschwerden und dem Unfallereignis vom 7. Oktober 2022.\n\nBeurteilung: Es fehlt der Nachweis einer frischen, unfallbedingten strukturellen Verletzung. Es ist von einer Prellung bzw. Stauchung der Brust- und/oder Lendenwirbelsäule auszugehen. Die maximale Behandlungsdauer beträgt acht Wochen. Der Status quo sine ist damit spätestens Ende Dezember 2022 erreicht.\n\nSchlussfolgerung: Die gesundheitlichen Beschwerden am Rücken sind nicht mehr mit überwiegender Wahrscheinlichkeit auf das Ereignis vom 7. Oktober 2022 zurückzuführen.\n\nDiese Beurteilung beruht auf den mir zur Verfügung gestellten Akten; eine persönliche Untersuchung des Versicherten fand nicht statt.\n\nDr. med. D.________\nFacharzt für Chirurgie FMH", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": [], "trap_type": "T2_superseded", "trap_note": "Die Beurteilung vom 28. September 2023 ist früher datiert als die massgebliche vom 5. Oktober 2023 und nennt acht Wochen und Ende Dezember 2022 statt sechs Wochen und Ende November 2022; die Verfügung stützt sich auf die spätere Fassung.", "source_sentence": null}}, {"doc_id": "D14", "type": "letter", "title": "Bestätigung Eingang Meldung Arbeitsunfähigkeit", "author": "B.________ AG, Krankentaggeld", "recipient": "A.________", "date": "2023-08-28", "reference": "Schaden-Nr. KT-2023-____", "body": "B.________ AG\nKrankentaggeld\n____\n\nA.________\n____\n____ (Deutschland)\n\n____, 28. August 2023\n\nMeldung Arbeitsunfähigkeit; Schaden-Nr. KT-2023-____\n\nSehr geehrter Herr A.________\n\nWir haben die Schadenmeldung Ihrer Arbeitgeberin, der C.________ AG, vom 18. August 2023 bezüglich Ihrer Arbeitsunfähigkeit wegen Krankheit ab dem 1. August 2023 erhalten.\n\nSie werden im Rahmen der kollektiven Krankentaggeldversicherung durch unsere Fachstelle begleitet. Ihre Arbeitgeberin hat uns am heutigen Tag zudem mitgeteilt, dass das Arbeitsverhältnis per 31. Juli 2023 aufgelöst worden ist.\n\nBitte teilen Sie uns Änderungen in Ihrem Gesundheitszustand oder Ihrer Arbeitsfähigkeit umgehend mit. Für Fragen steht Ihnen Ihre Sachbearbeiterin gerne zur Verfügung.\n\nFreundliche Grüsse\n\nB.________ AG\nKrankentaggeld\n\ni.V. ____          ____", "ground_truth": {"status": "real", "step_created": "S2_inquiry", "use_at_steps": ["S4_decision", "S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Schreiben vom 28. August 2023 teilte die Beklagte dem Kläger mit, sie habe die Meldung bezüglich der Arbeitsunfähigkeit erhalten und er werde im Rahmen der kollektiven Krankentaggeldversicherung begleitet."}}], "absent_document": {"type": "medical_report", "description": "Ein ärztliches Zeugnis oder Gutachten, das den Beginn der Arbeitsunfähigkeit und deren Ursache (Krankheit oder Unfallfolge) zeitlich einordnet, namentlich ob die volle Arbeitsunfähigkeit seit dem 7. Oktober 2022 ununterbrochen bestand.", "why_decisive": "Die Beklagte und das Sozialversicherungsgericht stellen auf den 1. August 2023 als Beginn der krankheitsbedingten Arbeitsunfähigkeit ab, weil das Arbeitsverhältnis am 31. Juli 2023 endete. Ohne ärztliche Einordnung, dass die Arbeitsunfähigkeit schon vor Vertragsende bestand, fehlt dem Kläger der Beleg für Versicherungsdeckung im Zeitpunkt des Eintritts.", "needed_at_step": "S6_cantonal_appeal"}, "questions": [{"step_index": 0, "after_step": "S3_pre_decision", "visible_doc_ids": ["D04", "D05", "D07", "D09"], "gold": {"next_step": "S1_claim", "next_action": "Die Arbeitgeberin meldet der Beklagten mit Schadenmeldung eine krankheitsbeding nd nicht den Kläger A.________ (Ereignis 7. Oktober 2022)."}, {"doc_id": "D13", "trap_type": "T2_superseded", "note": "Die Beurteilung vom 28. September 2023 ist früher datiert als die massgebliche vom 5. Oktober 2023 und nennt acht Wochen und Ende Dezember 2022 statt sechs Wochen und Ende November 2022; die Verfügung stützt sich auf die spätere Fassung."}], "missing_document": {"type": "medical_report", "description": "Ein ärztliches Zeugnis oder Gutachten, das den Beginn der Arbeitsunfähigkeit und deren Ursache (Krankheit oder Unfallfolge) zeitlich einordnet, namentlich ob die volle Arbeitsunfähigkeit seit dem 7. Oktober 2022 ununterbrochen bestand.", "why_decisive": "Die Beklagte und das Sozialversicherungsgericht stellen auf den 1. August 2023 als Beginn der krankheitsbedingten Arbeitsunfähigkeit ab, weil das Arbeitsverhältnis am 31. Juli 2023 endete. Ohne ärztliche Einordnung, dass die Arbeitsunfähigkeit schon vor Vertragsende bestand, fehlt dem Kläger der Beleg für Versicherungsdeckung im Zeitpunkt des Eintritts.", "needed_at_step": "S6_cantonal_appeal"}, "n_traps_visible": 5}}]}, "8C_229/2024": {"case_id": "8C_229/2024", "language": "fr", "domain": "IV", "outcome": "partial_approval", "steps": [{"code": "S1_claim", "date": "2022-02-28", "actor": "insured", "act": "A.________, par l'intermédiaire de ses parents, dépose deux demandes de prestations AI pour adultes: allocation pour impotent, et mesures professionnelles avec rente.", "deadline_rule": null}, {"code": "S2_inquiry", "date": "2023-08-23", "actor": "iv_office", "act": "Un rapport d'enquête à domicile constate que l'assuré est autonome dans les actes ordinaires de la vie mais a besoin d'un accompagnement de 2h50 par semaine pour faire face aux nécessités de la vie.", "deadline_rule": null}, {"code": "S4_decision", "date": "2023-10-26", "actor": "iv_office", "act": "Dans la révision d'office, l'office AI supprime le droit à l'allocation pour impotent dès le 1er janvier 2024. Il qualifie le TSA d'atteinte à la santé psychique et note que l'assuré n'a pas droit à une rente.", "deadline_rule": "30 jours dès la notification, art. 60 LPGA"}, {"code": "S6_cantonal_appeal", "date": null, "actor": "insured", "act": "A.________ recourt à la Cour des assurances sociales du Tribunal cantonal du canton de Vaud contre la décision du 26 octobre 2023.", "deadline_rule": "30 jours dès la notification, art. 60 LPGA"}, {"code": "S6b_cantonal_judgment", "date": null, "actor": "cantonal_court", "act": "La Cour des assurances sociales admet le recours et réforme la décision: A.________ a droit à une allocation pour impotent de degré faible dès le 1er janvier 2024.", "deadline_rule": "30 jours dès la notification, art. 100 LTF"}, {"code": "S7_federal_appeal", "date": null, "actor": "federal_office", "act": "L'OFAS interjette un recours en matière de droit public. Il conclut à l'annulation de l'arrêt cantonal et à la confirmation de la décision du 26 octobre 2023, et demande préalablement l'effet suspensif.", "deadline_rule": "30 jours dès la notification, art. 100 LTF"}, {"code": "S7b_interim", "date": "2024-08-28", "actor": "federal_court", "act": "Le Tribunal fédéral admet par ordonnance la requête d'effet suspensif. A.________ conclut au rejet du recours et demande l'assistance judiciaire limitée aux frais de justice.", "deadline_rule": null}], "documents": [{"doc_id": "D01", "type": "judgment", "title": "Arrêt de la Cour des assurances sociales", "author": "Cour des assurances sociales du Tribunal cantonal du canton de Vaud", "recipient": "A.________; Office de l'assurance-invalidité du canton de Vaud", "date": "2024-06-24", "reference": "AI ____/2023", "body": "Tribunal cantonal – Cour des assurances sociales. Arrêt du 24 juin 2024. Parties: A.________, recourant, contre Office de l'assurance-invalidité du canton de Vaud, intimé. Objet: allocation pour impotent (art. ____ LAI). En fait: A.________, né le 20 décembre 2005, est au bénéfice d'une infirmité congénitale selon le chiffre 405 OIC (trouble du spectre de l'autisme). Par décision du 26 octobre 2023, l'office AI a supprimé le droit à l'allocation pour impotent dès le 1er janvier 2024, dans le cadre de la révision d'office. Cette décision qualifiait le TSA d'atteinte à la santé psychique. A.________ a recouru contre cette décision. Par ces motifs, la Cour des assurances sociales prononce: I. Le recours est admis. II. La décision rendue le 26 octobre 2023 par l'Office de l'assurance-invalidité du canton de Vaud est réformée en ce sens que A.________ a droit à une allocation pour impotent de degré faible à compter du 1er janvier 2024. Voies de droit: le présent arrêt peut faire l'objet d'un recours en matière de droit public au Tribunal fédéral, Avenue du Tribunal-Fédéral 29, Lucerne, dans un délai de 30 jours dès sa notification (art. 82 ss et 100 LTF). Le président: ____. Le greffier: ____. Envoi recommandé N° 98.____.", "ground_truth": {"status": "real", "step_created": "S6b_cantonal_judgment", "use_at_steps": ["S7_federal_appeal", "S7b_interim"], "trap_type": null, "trap_note": "Real document; its date is not given in the facts and was reconstructed within the procedural window.", "source_sentence": "Saisi d'un recours, la Cour des assurances sociales du Tribunal cantonal du canton de Vaud l'a admis et a réformé la décision du 26 octobre 2023 en ce sens que A.________ a droit à une allocation pour impotent de degré faible à compter du 1er janvier 2024."}}, {"doc_id": "D02", "type": "appeal", "title": "Recours contre la décision du 26 octobre 2023", "author": "A.________, par ses parents B.________ et C.________", "recipient": "Cour des assurances sociales du Tribunal cantonal du canton de Vaud", "date": "2023-11-17", "reference": "AI ____/2023", "body": "Cour des assurances sociales du Tribunal cantonal, ____, Vaud. Recours de A.________, né le 20 décembre 2005, représenté par ses parents, contre la décision de l'Office de l'assurance-invalidité du canton de Vaud du 26 octobre 2023. Mesdames et Messieurs les Juges, Nous recourons contre la décision précitée, qui supprime le droit de notre fils à l'allocation pour impotent dès le 1er janvier 2024. Conclusions: 1. Le recours est admis. 2. La décision du 26 octobre 2023 est annulée. 3. A.________ a droit à une allocation pour impotent de degré moyen dès le 1er janvier 2024. Notre fils a été reconnu atteint d'une infirmité congénitale selon le chiffre 405 OIC et a perçu une allocation pour impotent de degré moyen dès le 1er mars 2012. Le rapport d'enquête à domicile du 23 août 2023 retient un besoin d'accompagnement de 2h50 par semaine pour faire face aux nécessités de la vie. Nous requérons en outre le bénéfice de l'assistance judiciaire limitée aux frais de justice. Veuillez agréer, Mesdames et Messieurs les Juges, l'expression de notre haute considération. Annexes: décision attaquée; rapport d'enquête. B.________ et C.________, parents de A.________.", "ground_truth": {"status": "trap", "step_created": "S6_cantonal_appeal", "use_at_steps": ["S6_cantonal_appeal"], "trap_type": "T3_unsent", "trap_note": "The signature block carries no signature, there is no registered-mail number, receipt stamp or court acknowledgement, and it claims degré moyen whereas the filed appeal led to degré faible.", "source_sentence": null}}, {"doc_id": "D03", "type": "inquiry_report", "title": "Rapport d'enquête à domicile", "author": "Enquêtrice AI, Office de l'assurance-invalidité du canton de Vaud", "recipient": "Dossier AI de A.________", "date": "2023-08-23", "reference": "AI 756.____ / EAD-2023", "body": "Office de l'assurance-invalidité du canton de Vaud – Service des prestations. Rapport d'enquête à domicile du 23 août 2023. Assuré: A.________, né le 20 décembre 2005. Représentants légaux: B.________ et C.________. Motif de l'enquête: demande d'allocation pour impotent déposée le 28 février 2022. Antécédents: l'assuré présente un trouble du spectre de l'autisme (infirmité congénitale ch. 405 OIC). Il a perçu une allocation pour impotent de degré faible dès le 1er juin 2011, puis moyen dès le 1er mars 2012. Constatations: à la date de l'enquête, A.________ est désormais autonome dans les actes ordinaires de la vie. Il a néanmoins besoin d'un accompagnement pour faire face aux nécessités de la vie. Le temps nécessaire à cet accompagnement est évalué à 2h50 par semaine. Formation: A.________ a intégré le Centre de formation TEM de U.________ au terme de sa scolarité obligatoire, puis a bénéficié d'une orientation professionnelle de trois mois auprès de D.________. Le présent rapport est transmis au service compétent de l'office AI pour suite utile. Lieu et date: ____, le 23 août 2023. L'enquêtrice: ____ (signature).", "ground_truth": {"status": "real", "step_created": "S2_inquiry", "use_at_steps": ["S4_decision", "S6_cantonal_appeal", "S6b_cantonal_judgment", "S7_federal_appeal"], "trap_type": null, "trap_note": "Real document.", "source_sentence": "Selon un rapport d'enquête à domicile du 23 août 2023, A.________ était désormais autonome dans les actes ordinaires de la vie, mais avait néanmoins besoin d'un accompagnement pour faire face aux nécessités de la vie (2h50 par semaine)."}}, {"doc_id": "D04", "type": "statute_extract", "title": "Art. 38 RAI – Accompagnement pour faire face aux nécessités de la vie", "author": "Recueil systématique du droit fédéral (extrait consolidé)", "recipient": "Dossier AI de A.________", "date": "2025-01-15", "reference": "RS 831.201", "body": "Règlement sur l'assurance-invalidité (RAI) du 17 janvier 1961 – Extrait, état au 1er janvier 2025. Art. 38 Accompagnement pour faire face aux nécessités de la vie. 1 Il y a besoin d'un accompagnement durable pour faire face aux nécessités de la vie lorsque, même si elle vit de manière indépendante, la personne assurée n'est pas en mesure de gérer seule son quotidien et dépend de l'aide régulière de tiers. 2 L'accompagnement est pris en considération s'il est nécessaire pour permettre à la personne assurée de vivre de manière indépendante, d'éviter son isolement durable ou de se rendre à des activités extérieures au domicile. 3 Lorsque l'atteinte à la santé est d'ordre psychique, l'accompagnement ouvre le droit à l'allocation pour impotent uniquement si la personne assurée a droit à une rente ou à des mesures de réadaptation d'ordre professionnel de l'assurance-invalidité. 4 Les prestations d'accompagnement fournies dans le cadre d'une institution sont prises en compte selon les directives de l'Office fédéral des assurances sociales. Dispositions transitoires: les procédures pendantes à la date d'entrée en vigueur de la présente teneur sont traitées conformément au nouveau droit. Source: RO 2024 ____.", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": ["S4_decision", "S6_cantonal_appeal"], "trap_type": "T5_wrong_law_version", "trap_note": "The extract is consolidated at 1 January 2025, so it is not the wording in force on 26 October 2023, and paragraph 3 is amended (rente OR professional measures); reviewer should check the fabricated wording against the real versions.", "source_sentence": null}}, {"doc_id": "D05", "type": "decision", "title": "Décision – Révision d'office du droit à l'allocation pour impotent", "author": "Office de l'assurance-invalidité du canton de Vaud", "recipient": "A.________, p.a. B.________ et C.________, ____", "date": "2023-10-26", "reference": "AI 756.____ / API-2023", "body": "Office de l'assurance-invalidité du canton de Vaud. Décision du 26 octobre 2023. Assuré: A.________, né le 20 décembre 2005. Objet: révision d'office du droit à l'allocation pour impotent. Dans le cadre de la révision d'office du droit à l'allocation pour impotent, l'office AI supprime le droit à cette prestation dès le 1er janvier 2024, soit dès le premier jour suivant le dix-huitième anniversaire de l'assuré. Motifs: selon le rapport d'enquête à domicile du 23 août 2023, l'assuré est autonome dans les actes ordinaires de la vie et a besoin d'un accompagnement de 2h50 par semaine pour faire face aux nécessités de la vie. L'office AI qualifie le trouble du spectre de l'autisme d'atteinte à la santé psychique. L'accompagnement pour faire face aux nécessités de la vie n'ouvre le droit à une allocation pour impotent, pour les personnes atteintes dans leur santé psychique, qu'à la condition d'avoir également droit à une rente. Tel n'est pas le cas de l'assuré. Voies de droit: la présente décision peut faire l'objet d'un recours auprès de la Cour des assurances sociales du Tribunal cantonal du canton de Vaud, ____, dans un délai de 30 jours dès sa notification (art. 56 et 60 LPGA). Office AI Vaud, ____. Envoi recommandé N° 98.____.", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S6_cantonal_appeal", "S6b_cantonal_judgment", "S7_federal_appeal"], "trap_type": null, "trap_note": "Real document.", "source_sentence": "Dans l'intervalle, par décision du 26 octobre 2023, l'office AI a informé l'assuré que dans le cadre de la révision d'office du droit à l'allocation pour impotent, il supprimait le droit à la prestation dès le 1er janvier 2024, soit dès le premier jour suivant le dix-huitième anniversaire, au motif que l'accompagnement pour faire face aux nécessités de la vie n'ouvrait le droit à une allocation pour impotent pour les personnes atteintes dans leur santé psychique qu'à la condition d'avoir également droit à une rente, ce qui n'était pas son cas."}}, {"doc_id": "D06", "type": "inquiry_report", "title": "Rapport d'enquête à domicile", "author": "Enquêtrice AI, Office de l'assurance-invalidité du canton de Vaud", "recipient": "Dossier AI de A.________", "date": "2023-06-30", "reference": "AI 756.____ / EAD-2023", "body": "Office de l'assurance-invalidité du canton de Vaud – Service des prestations. Rapport d'enquête à domicile du 30 juin 2023. Assuré: A.________, né le 20 décembre 2005. Représentants légaux: B.________ et C.________. Motif de l'enquête: demande d'allocation pour impotent déposée le 28 février 2022. Antécédents: l'assuré présente un trouble du spectre de l'autisme (infirmité congénitale ch. 405 OIC). Il a perçu une allocation pour impotent de degré faible dès le 1er juin 2011, puis moyen dès le 1er mars 2012. Constatations: à la date de l'enquête, A.________ est autonome dans les actes ordinaires de la vie. Il a besoin d'un accompagnement pour faire face aux nécessités de la vie. Le temps nécessaire à cet accompagnement est évalué à 4h15 par semaine. Formation: A.________ a intégré le Centre de formation TEM de U.________ au terme de sa scolarité obligatoire, puis a bénéficié d'une orientation professionnelle de trois mois auprès de D.________. Le présent rapport est transmis au service compétent de l'office AI pour suite utile. Lieu et date: ____, le 30 juin 2023. L'enquêtrice: ____ (signature).", "ground_truth": {"status": "trap", "step_created": "S2_inquiry", "use_at_steps": ["S2_inquiry", "S4_decision"], "trap_type": "T2_superseded", "trap_note": "Dated 30 June 2023, earlier than the 23 August 2023 report; its 4h15 weekly figure is corrected to 2h50 in the later report and in the decision.", "source_sentence": null}}, {"doc_id": "D07", "type": "appeal", "title": "Recours en matière de droit public", "author": "Office fédéral des assurances sociales (OFAS)", "recipient": "Tribunal fédéral, Avenue du Tribunal-Fédéral 29, 1000 Lausanne 14", "date": "2024-08-12", "reference": "OFAS ____ / AI-API", "body": "Office fédéral des assurances sociales, Effingerstrasse 20, 3003 Berne. Recours en matière de droit public contre l'arrêt de la Cour des assurances sociales du Tribunal cantonal du canton de Vaud du 24 juin 2024 dans la cause A.________ contre Office de l'assurance-invalidité du canton de Vaud. Conclusions: 1. Le recours est admis. 2. L'arrêt cantonal est annulé et la décision de l'office AI du 26 octobre 2023 est confirmée. Requête préalable: l'OFAS demande que le recours soit assorti de l'effet suspensif. Exposé: par décision du 26 octobre 2023, l'office AI a supprimé le droit de l'assuré, né le 20 décembre 2005, à l'allocation pour impotent dès le 1er janvier 2024, dans le cadre de la révision d'office. L'office AI a retenu que l'accompagnement pour faire face aux nécessités de la vie n'ouvre le droit à l'allocation, pour les personnes atteintes dans leur santé psychique, qu'à la condition d'avoir également droit à une rente. Il a qualifié le trouble du spectre de l'autisme d'atteinte à la santé psychique. L'arrêt cantonal a admis le recours de l'assuré. Annexes: arrêt attaqué. Berne, le 12 août 2024. Pour l'Office fédéral des assurances sociales: ____ .", "ground_truth": {"status": "real", "step_created": "S7_federal_appeal", "use_at_steps": ["S7_federal_appeal", "S7b_interim"], "trap_type": null, "trap_note": "Real document; its date is not given in the facts and was reconstructed within the procedural window.", "source_sentence": "L'Office fédéral des assurances sociales (OFAS) interjette un recours en matière de droit public en concluant à l'annulation de l'arrêt cantonal et à la confirmation de la décision de l'office AI du 26 octobre 2023. À titre préalable, l'OFAS demande que son recours soit assorti de l'effet suspensif."}}, {"doc_id": "D08", "type": "claim", "title": "Demandes de prestations AI pour adultes", "author": "B.________ et C.________, pour A.________", "recipient": "Office de l'assurance-invalidité du canton de Vaud", "date": "2022-02-28", "reference": "AI 756.____ / DEM-2022", "body": "Office de l'assurance-invalidité du canton de Vaud, ____. Objet: demandes de prestations AI pour adultes. Mesdames, Messieurs, Nous vous faisons parvenir, au nom de notre fils A.________, né le 20 décembre 2005, deux demandes de prestations de l'assurance-invalidité pour adultes: l'une tendant au versement d'une allocation pour impotent, l'autre à l'octroi de mesures professionnelles et de rente. Notre fils a été annoncé à l'AI le 18 octobre 2011 en raison de troubles envahissants du développement (TED; CIM-10 F84). L'office AI a admis une infirmité congénitale selon le chiffre 405 OIC (trouble du spectre de l'autisme) et a pris en charge des mesures médicales dès le 21 juillet 2011. Il a reconnu une allocation pour impotent de degré faible dès le 1er juin 2011, puis moyen dès le 1er mars 2012. Au terme de sa scolarité obligatoire, A.________ a intégré le Centre de formation TEM de U.________, puis a bénéficié d'une orientation professionnelle de trois mois auprès de D.________. Nous restons à votre disposition pour tout renseignement complémentaire. Salutations distinguées. B.________ et C.________, représentants légaux. Envoi recommandé N° 98.____.", "ground_truth": {"status": "real", "step_created": "S1_claim", "use_at_steps": ["S2_inquiry", "S4_decision", "S6_cantonal_appeal"], "trap_type": null, "trap_note": "Real document.", "source_sentence": "Le 28 février 2022, A.________ a déposé, par l'intermédiaire de ses parents, deux demandes de prestations AI pour adultes, l'une tendant au versement d'une allocation pour impotent, l'autre à l'octroi de mesures professionnelles et de rente."}}, {"doc_id": "D09", "type": "letter", "title": "Courrier – Suite de la formation pratique INSOS", "author": "Office de l'assurance-invalidité du canton de Vaud", "recipient": "B.________ et C.________, ____", "date": "2025-02-10", "reference": "AI 756.____ / MP-2025", "body": "Office de l'assurance-invalidité du canton de Vaud. Lausanne, le 10 février 2025. Concerne: A.________, né le 20 décembre 2005 – formation pratique INSOS, industrie légère. Madame, Monsieur, Nous faisons référence à notre communication du 4 décembre 2023, par laquelle nous avons pris en charge les coûts de la formation professionnelle initiale de votre fils du 21 novembre 2023 au 20 novembre 2025. Nous constatons que cette formation arrive à son terme dans le courant de l'année. Afin de préparer la suite du parcours professionnel de A.________, nous vous invitons à un entretien avec son conseiller en réadaptation. Nous vous prions de prendre en compte, pour cet entretien, l'évolution de la procédure relative à l'allocation pour impotent, ainsi que l'arrêt rendu par la juridiction cantonale. L'institution formatrice continue de verser les indemnités journalières sous forme de salaire jusqu'à la fin de la formation. Veuillez nous indiquer vos disponibilités par retour de courrier. Nous vous prions d'agréer, Madame, Monsieur, nos salutations distinguées. Le conseiller en réadaptation: ____. Office AI Vaud, ____.", "ground_truth": {"status": "trap", "step_created": "S6_cantonal_appeal", "use_at_steps": ["S6_cantonal_appeal"], "trap_type": "T1_future", "trap_note": "Dated 10 February 2025, well after the cantonal appeal stage, and refers to the cantonal judgment and procedural developments the agent has not yet seen.", "source_sentence": null}}, {"doc_id": "D10", "type": "appeal", "title": "Recours contre la décision du 26 octobre 2023", "author": "A.________, par ses parents B.________ et C.________", "recipient": "Cour des assurances sociales du Tribunal cantonal du canton de Vaud", "date": "2023-11-24", "reference": "AI ____/2023", "body": "Cour des assurances sociales du Tribunal cantonal, ____, Vaud. Recours de A.________, né le 20 décembre 2005, représenté par ses parents, contre la décision de l'Office de l'assurance-invalidité du canton de Vaud du 26 octobre 2023. Mesdames et Messieurs les Juges, Nous recourons contre la décision précitée, qui supprime le droit de notre fils à l'allocation pour impotent dès le 1er janvier 2024. Conclusions: 1. Le recours est admis. 2. La décision du 26 octobre 2023 est réformée en ce sens que A.________ a droit à une allocation pour impotent de degré faible dès le 1er janvier 2024. Notre fils a été reconnu atteint d'une infirmité congénitale selon le chiffre 405 OIC et a perçu une allocation pour impotent de degré faible dès le 1er juin 2011, puis moyen dès le 1er mars 2012. Le rapport d'enquête à domicile du 23 août 2023 retient un besoin d'accompagnement de 2h50 par semaine pour faire face aux nécessités de la vie. Nous requérons le bénéfice de l'assistance judiciaire limitée aux frais de justice. Veuillez agréer, Mesdames et Messieurs les Juges, l'expression de notre haute considération. Annexes: décision attaquée; rapport d'enquête. Lausanne, le 24 novembre 2023. B.________ et C.________ (signatures). Envoi recommandé N° 98.____. Reçu au greffe le 27 novembre 2023.", "ground_truth": {"status": "real", "step_created": "S6_cantonal_appeal", "use_at_steps": ["S6b_cantonal_judgment", "S7_federal_appeal"], "trap_type": null, "trap_note": "Real document; its date, grounds and receipt stamp are not given in the facts and were reconstructed within the 30-day window.", "source_sentence": "Saisi d'un recours, la Cour des assurances sociales du Tribunal cantonal du canton de Vaud l'a admis et a réformé la décision du 26 octobre 2023"}}, {"doc_id": "D11", "type": "order", "title": "Ordonnance – Effet suspensif", "author": "Tribunal fédéral, Ire Cour de droit social", "recipient": "Office fédéral des assurances sociales; A.________; Tribunal cantonal du canton de Vaud", "date": "2024-08-28", "reference": "8C_229/2024", "body": "Tribunal fédéral. Ordonnance du 28 août 2024. Cause 8C_229/2024. Parties: Office fédéral des assurances sociales, recourant, contre A.________, intimé, et Office de l'assurance-invalidité du canton de Vaud. Objet: allocation pour impotent; effet suspensif. Vu le recours en matière de droit public interjeté par l'Office fédéral des assurances sociales contre l'arrêt de la Cour des assurances sociales du Tribunal cantonal du canton de Vaud du 24 juin 2024, vu la requête d'effet suspensif présentée à titre préalable par le recourant, le Tribunal fédéral ordonne: 1. La requête d'effet suspensif est admise. 2. La présente ordonnance est communiquée aux parties et au Tribunal cantonal du canton de Vaud. Lausanne, le 28 août 2024. Au nom de la Ire Cour de droit social du Tribunal fédéral. Le juge instructeur: ____. Le greffier: ____.", "ground_truth": {"status": "real", "step_created": "S7b_interim", "use_at_steps": ["S7b_interim"], "trap_type": null, "trap_note": "Real document.", "source_sentence": "Par ordonnance du 28 août 2024, le Tribunal fédéral a admis la requête d'effet suspensif."}}, {"doc_id": "D12", "type": "decision", "title": "Décision – Révision d'office du droit à l'allocation pour impotent", "author": "Office de l'assurance-invalidité du canton de Vaud", "recipient": "A.________, p.a. E.________ et F.________, ____", "date": "2022-11-21", "reference": "AI 756.____ / API-2022", "body": "Office de l'assurance-invalidité du canton de Vaud. Décision du 21 novembre 2022. Assuré: A.________, né le 20 décembre 2004, AVS 756.____.____.__. Objet: révision d'office du droit à l'allocation pour impotent. Dans le cadre de la révision d'office du droit à l'allocation pour impotent, l'office AI supprime le droit à cette prestation dès le 1er janvier 2023, soit dès le premier jour suivant le dix-huitième anniversaire de l'assuré. Motifs: l'assuré est autonome dans les actes ordinaires de la vie. Il a besoin d'un accompagnement pour faire face aux nécessités de la vie. L'office AI qualifie l'atteinte de l'assuré d'atteinte à la santé psychique. L'accompagnement n'ouvre le droit à une allocation pour impotent, pour les personnes atteintes dans leur santé psychique, qu'à la condition d'avoir également droit à une rente, ce qui n'est pas le cas. Voies de droit: la présente décision peut faire l'objet d'un recours auprès de la Cour des assurances sociales du Tribunal cantonal du canton de Vaud, ____, dans un délai de 30 jours dès sa notification (art. 56 et 60 LPGA). Office AI Vaud, ____. Envoi recommandé N° 98.____.", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": ["S4_decision", "S6_cantonal_appeal"], "trap_type": "T4_wrong_person", "trap_note": "Same anonymised
