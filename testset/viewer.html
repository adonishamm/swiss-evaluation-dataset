er", "act": "L'esame di RMN del 19 maggio 2022 documenta le lesioni della caviglia sinistra; nel settembre 2023 segue un intervento artroscopico diagnostico con microfratture del talo laterale, mentre l'INSAI assume il caso e versa le prestazioni di legge fino alla chiusura.", "deadline_rule": null}, {"code": "S4_decision", "date": "2024-06-24", "actor": "insurer", "act": "Con decisione formale l'INSAI nega la rendita (reddito da invalido fr. 67'899.- superiore al reddito da valido fr. 65'298.-) e assegna un'IMI del 5 %.", "deadline_rule": "30 giorni dalla notifica per l'opposizione, art. 52 LPGA"}, {"code": "S5_objection", "date": null, "actor": "insured", "act": "L'assicurato interpone opposizione contro la decisione del 24 giugno 2024 (data esatta non indicata nei fatti).", "deadline_rule": "30 giorni dalla notifica della decisione, art. 52 cpv. 1 LPGA"}, {"code": "S4_decision", "date": "2024-09-09", "actor": "insurer", "act": "Con decisione su opposizione l'INSAI conferma la decisione iniziale, fissando però il reddito da invalido in fr. 68'236.19 in base all'evoluzione nominale dei salari.", "deadline_rule": "30 giorni dalla notifica per il ricorso cantonale, art. 56 e 60 LPGA"}, {"code": "S6_cantonal_appeal", "date": null, "actor": "insured", "act": "L'assicurato ricorre al Tribunale delle assicurazioni del Cantone Ticino contro la decisione su opposizione (data non indicata nei fatti).", "deadline_rule": "30 giorni dalla notifica della decisione su opposizione, art. 60 LPGA"}, {"code": "S6b_cantonal_judgment", "date": "2025-03-24", "actor": "cantonal_court", "act": "Il Tribunale cantonale accoglie parzialmente il ricorso e condanna l'INSAI a riconoscere una rendita d'invalidità del 13 % dal 1° luglio 2024.", "deadline_rule": "30 giorni dalla notifica per il ricorso in materia di diritto pubblico, art. 100 cpv. 1 LTF"}, {"code": "S7_federal_appeal", "date": null, "actor": "insurer", "act": "L'INSAI presenta ricorso in materia di diritto pubblico al Tribunale federale, chiedendo l'annullamento della sentenza cantonale e la conferma della decisione su opposizione del 9 settembre 2024; l'assicurato postula la reiezione del ricorso, l'UFSP si esprime nello stesso senso e la Corte cantonale rinuncia a presentare osservazioni.", "deadline_rule": "30 giorni dalla notifica della sentenza cantonale, art. 100 cpv. 1 LTF"}, {"code": "S7b_interim", "date": "2026-06-23", "actor": "federal_court", "act": "Il Tribunale federale indice una deliberazione pubblica, che si tiene il 23 giugno 2026.", "deadline_rule": null}], "documents": [{"doc_id": "D01", "type": "judgment", "title": "Sentenza del Tribunale cantonale delle assicurazioni", "author": "Tribunale delle assicurazioni del Cantone Ticino", "recipient": "A.________; INSAI, Agenzia di ____", "date": "2025-03-24", "reference": "Incarto n. 35.2024.____", "body": "TRIBUNALE CANTONALE DELLE ASSICURAZIONI\nSezione di diritto delle assicurazioni sociali\n\nSentenza del 24 marzo 2025\n\nnella causa\nA.________, ____, ricorrente,\ncontro\nIstituto nazionale svizzero di assicurazione contro gli infortuni (INSAI), Lucerna, resistente,\nconcernente la decisione su opposizione del 9 settembre 2024.\n\nIn fatto\nIl 25 marzo 2022 l'assicurato, nato nel 1985 e piastrellista alle dipendenze della B.________ SA, ha riportato un trauma distorsivo alla caviglia sinistra. Con decisione del 24 giugno 2024, confermata su opposizione il 9 settembre 2024, l'INSAI ha negato il diritto a una rendita d'invalidità e ha assegnato un'indennità per menomazione dell'integrità del 5 %. Contro tale decisione l'assicurato è insorto con ricorso a questo Tribunale.\n\nPer questi motivi\nIl Tribunale delle assicurazioni pronuncia:\n1. Il ricorso è parzialmente accolto. L'INSAI è condannato a riconoscere all'assicurato una rendita d'invalidità del 13 % a partire dal 1° luglio 2024.\n2. Intimazione a: A.________; INSAI; Ufficio federale della sanità pubblica.\n\nVoie di diritto\nContro la presente sentenza può essere interposto ricorso in materia di diritto pubblico al Tribunale federale, 1000 Losanna 14, entro 30 giorni dalla notifica (art. 82 segg. e 100 cpv. 1 LTF).\n\nPer il Tribunale delle assicurazioni\nIl giudice: ____   La segretaria: ____", "ground_truth": {"status": "real", "step_created": "S6b_cantonal_judgment", "use_at_steps": ["S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Con sentenza del 24 marzo 2025, il Tribunale delle assicurazioni del Cantone Ticino ha parzialmente accolto il ricorso interposto dall'assicurato e condannato l'INSAI a riconoscergli una rendita d'invalidità del 13 % a partire dal 1° luglio 2024."}}, {"doc_id": "D02", "type": "decision", "title": "Decisione formale – diniego di rendita d'invalidità", "author": "INSAI, Servizio prestazioni", "recipient": "C.________, ____", "date": "2024-06-27", "reference": "Sinistro n. 61.2022.5120-4", "body": "ISTITUTO NAZIONALE SVIZZERO DI ASSICURAZIONE CONTRO GLI INFORTUNI (INSAI)\nAgenzia di ____\n\nDecisione del 27 giugno 2024\n\nAssicurato: C.________, nato il 14.02.1983, n. AVS 756.____.____.__\nDatore di lavoro: B.________ SA, U.________ (TI)\nProfessione: piastrellista\nEvento: infortunio del 11 ottobre 2021, distorsione al ginocchio destro\n\nIn fatto\nL'assicurato ha riportato un infortunio il 11 ottobre 2021. L'istituto ha corrisposto le prestazioni di legge fino alla chiusura del caso.\n\nIn diritto\nIl reddito da invalido è stato fissato in fr. 70'120.-, mentre il reddito da valido ammonta a fr. 69'400.-. Ne risulta che non sussiste un grado d'invalidità tale da fondare il diritto a una rendita. All'assicurato è assegnata un'indennità per menomazione dell'integrità del 10 %.\n\nDecide\n1. Il diritto a una rendita d'invalidità è negato.\n2. È riconosciuta un'indennità per menomazione dell'integrità del 10 %.\n\nVoie di diritto\nContro la presente decisione può essere interposta opposizione scritta e motivata presso l'INSAI entro 30 giorni dalla notifica (art. 52 LPGA).\n\nINSAI – Servizio prestazioni\n____", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": [], "trap_type": "T4_wrong_person", "trap_note": "Decisione su un collega (C.________, nato nel 1983, altro sinistro del 2021, altri redditi) presso lo stesso datore di lavoro; data di nascita, numero di sinistro e iniziale differiscono da quelli dell'assicurato.", "source_sentence": null}}, {"doc_id": "D03", "type": "objection", "title": "Opposizione alla decisione del 24 giugno 2024", "author": "A.________", "recipient": "INSAI, Agenzia di ____", "date": "2024-07-22", "reference": "Sinistro n. 61.2022.4417-8", "body": "A.________\n____\n\nRaccomandata n. RA 98.00.4417 2210.9\n\nINSAI\nAgenzia di ____\n\n____, 22 luglio 2024\n\nOggetto: Opposizione alla decisione del 24 giugno 2024 – Sinistro n. 61.2022.4417-8\n\nGentili signore, egregi signori,\n\nin qualità di assicurato, nato nel 1985, già alle dipendenze della B.________ SA di U.________ (TI) come piastrellista, interpongo con la presente opposizione contro la decisione formale del 24 giugno 2024, con cui l'istituto ha negato il diritto a una rendita d'invalidità ritenendo il reddito da invalido (fr. 67'899.-) superiore al reddito da valido (fr. 65'298.-) e ha riconosciuto un'indennità per menomazione dell'integrità del 5 %.\n\nChiedo il riesame della decisione e mi riservo di completare la motivazione dopo la consultazione dell'incarto, di cui chiedo copia.\n\nAllegato: decisione del 24 giugno 2024.\n\nCon osservanza.\n\n(firmato) A.________", "ground_truth": {"status": "real", "step_created": "S5_objection", "use_at_steps": ["S5_objection", "S6_cantonal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "A seguito dell'opposizione interposta da A.________, in data 9 settembre 2024 l'assicuratore ha in sostanza confermato il contenuto della sua prima decisione"}}, {"doc_id": "D04", "type": "statute_extract", "title": "Art. 16 LPGA – Grado d'invalidità; art. 18 cpv. 1 LAINF – Rendita d'invalidità", "author": "Fedlex – Raccolta sistematica del diritto federale", "recipient": "Atti della causa", "date": "2026-07-01", "reference": "RS 830.1 / RS 832.20", "body": "FEDLEX – La piattaforma di pubblicazione del diritto federale\n\nLegge federale sulla parte generale del diritto delle assicurazioni sociali (LPGA), RS 830.1\nStato: 1° luglio 2026\n\nArt. 16 Grado d'invalidità\nPer valutare il grado d'invalidità, il reddito del lavoro che l'assicurato invalido potrebbe conseguire esercitando l'attività ragionevolmente esigibile da lui dopo la cura medica e l'esecuzione di eventuali provvedimenti d'integrazione, tenuto conto di una situazione equilibrata del mercato del lavoro, è paragonato al reddito che egli avrebbe potuto conseguire se non fosse diventato invalido.\n\nLegge federale sull'assicurazione contro gli infortuni (LAINF), RS 832.20\nStato: 1° luglio 2026\n\nArt. 18 Rendita d'invalidità\n1 Se l'assicurato è invalido (art. 8 LPGA) almeno al 10 per cento a causa di un infortunio, ha diritto a una rendita d'invalidità, sempreché l'infortunio non sia avvenuto all'estero.\n\nLe presenti disposizioni sono riprodotte nel testo consolidato disponibile in linea. Per le versioni anteriori consultare la cronologia delle modifiche della raccolta sistematica.\n\nSito: www.fedlex.admin.ch", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": [], "trap_type": "T5_wrong_law_version", "trap_note": "Testo consolidato allo stato del 1° luglio 2026, cioè successivo alle decisioni del 24 giugno e del 9 settembre 2024: non è la versione in vigore alla data rilevante; l'indizio è la data di consolidamento.", "source_sentence": null}}, {"doc_id": "D05", "type": "claim", "title": "Denuncia di infortunio LAINF", "author": "B.________ SA, U.________ (TI)", "recipient": "INSAI, Agenzia di ____", "date": "2022-03-25", "reference": "Sinistro n. 61.2022.4417-8", "body": "DENUNCIA DI INFORTUNIO LAINF\n\nDatore di lavoro: B.________ SA, ____, U.________ (TI)\nAssicurato: A.________, nato nel 1985\nProfessione: piastrellista\nData dell'infortunio: 25 marzo 2022\n\nDescrizione dell'evento: l'assicurato ha riportato un trauma distorsivo alla caviglia sinistra.\nParte del corpo colpita: caviglia sinistra\nTipo di lesione: distorsione\n\nL'assicurato è alle dipendenze della scrivente ditta in qualità di piastrellista ed è assicurato d'obbligo contro gli infortuni e le malattie professionali presso l'INSAI.\n\nSi trasmette la presente denuncia affinché l'istituto assuma il caso e proceda agli accertamenti di sua competenza. Per eventuali ulteriori informazioni sulla dinamica dell'evento rimaniamo a disposizione.\n\nLuogo e data: U.________, 25 marzo 2022\n\nTimbro e firma del datore di lavoro: B.________ SA – (firmato)\n\nRicevuto dall'INSAI, Agenzia di ____: timbro di entrata", "ground_truth": {"status": "real", "step_created": "S1_claim", "use_at_steps": ["S2_inquiry", "S4_decision", "S6_cantonal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Il 25 marzo 2022, A.________, nato nel 1985, a quel momento alle dipendenze della ditta B.________ SA di U.________ (TI) in qualità di piastrellista e, perciò, assicurato d'obbligo contro gli infortuni e le malattie professionali presso I'Istituto nazionale svizzero di assicurazione contro gli infortuni (INSAI), ha riportato un trauma distorsivo alla caviglia sinistra."}}, {"doc_id": "D06", "type": "appeal", "title": "Ricorso in materia di diritto pubblico", "author": "INSAI, Servizio giuridico, Lucerna", "recipient": "Tribunale federale, 1000 Losanna 14", "date": "2025-04-30", "reference": "INSAI rif. 61.2022.4417-8", "body": "Raccomandata\nTribunale federale\nIII Corte di diritto sociale\n1000 Losanna 14\n\nLucerna, 30 aprile 2025\n\nRicorso in materia di diritto pubblico\n\nRicorrente: Istituto nazionale svizzero di assicurazione contro gli infortuni (INSAI), Fluhmattstrasse 1, Lucerna\nControparte: A.________, ____\n\nconcernente la sentenza del 24 marzo 2025 del Tribunale delle assicurazioni del Cantone Ticino (incarto n. 35.2024.____).\n\nConclusioni\nL'INSAI chiede:\n1. di annullare la sentenza cantonale del 24 marzo 2025, con cui l'istituto è stato condannato a riconoscere all'assicurato una rendita d'invalidità del 13 % a partire dal 1° luglio 2024;\n2. di confermare la decisione su opposizione del 9 settembre 2024.\n\nIn fatto\nL'assicurato, piastrellista nato nel 1985, ha subito il 25 marzo 2022 un trauma distorsivo alla caviglia sinistra. Con decisione del 24 giugno 2024, confermata su opposizione il 9 settembre 2024, l'istituto ha negato la rendita e assegnato un'IMI del 5 %. Il reddito da invalido è stato fissato in fr. 68'236.19, quello da valido in fr. 65'298.-.\n\nLa sentenza impugnata è stata notificata nel termine di ricorso di 30 giorni (art. 100 cpv. 1 LTF). I motivi sono sviluppati nella parte in diritto.\n\nCon osservanza.\nINSAI – Servizio giuridico\n(firmato)", "ground_truth": {"status": "real", "step_created": "S7_federal_appeal", "use_at_steps": ["S7_federal_appeal", "S7b_interim"], "trap_type": null, "trap_note": "", "source_sentence": "L'INSAI presenta un ricorso in materia di diritto pubblico al Tribunale federale, chiedendo l'annullamento della sentenza cantonale e la conferma della decisione su opposizione del 9 settembre 2024."}}, {"doc_id": "D07", "type": "objection", "title": "Opposizione alla decisione del 24 giugno 2024", "author": "A.________", "recipient": "INSAI, Agenzia di ____", "date": "2024-07-10", "reference": "Sinistro n. 61.2022.4417-8", "body": "A.________\n____\n\nINSAI\nAgenzia di ____\n\n____, 10 luglio 2024\n\nOggetto: Opposizione alla decisione del 24 giugno 2024 – Sinistro n. 61.2022.4417-8\n\nGentili signore, egregi signori,\n\nin qualità di assicurato, nato nel 1985, già alle dipendenze della B.________ SA di U.________ (TI) come piastrellista, interpongo opposizione contro la decisione formale del 24 giugno 2024, con cui l'istituto ha negato il diritto a una rendita d'invalidità ritenendo il reddito da invalido (fr. 67'899.-) superiore al reddito da valido (fr. 65'298.-) e ha riconosciuto un'indennità per menomazione dell'integrità del 5 %.\n\nChiedo che la decisione sia riesaminata e che mi venga trasmesso l'incarto completo. Mi riservo di integrare la motivazione.\n\nAllegato: decisione del 24 giugno 2024.\n\nCon osservanza.\n\nA.________\n\n(firma)", "ground_truth": {"status": "trap", "step_created": "S5_objection", "use_at_steps": [], "trap_type": "T3_unsent", "trap_note": "Opposizione mai inviata: la firma è solo un segnaposto, manca il numero di raccomandata e il timbro di ricevimento, e la data (10 luglio) non coincide con l'opposizione effettivamente depositata il 22 luglio 2024.", "source_sentence": null}}, {"doc_id": "D08", "type": "decision", "title": "Decisione formale – diniego di rendita d'invalidità e assegnazione di IMI", "author": "INSAI, Servizio prestazioni", "recipient": "A.________, ____", "date": "2024-06-24", "reference": "Sinistro n. 61.2022.4417-8", "body": "ISTITUTO NAZIONALE SVIZZERO DI ASSICURAZIONE CONTRO GLI INFORTUNI (INSAI)\nAgenzia di ____\n\nDecisione del 24 giugno 2024\n\nAssicurato: A.________, nato nel 1985, n. AVS 756.____.____.__\nDatore di lavoro: B.________ SA, U.________ (TI)\nProfessione: piastrellista\nEvento: infortunio del 25 marzo 2022, trauma distorsivo alla caviglia sinistra\n\nIn fatto\nL'istituto ha assunto il caso e ha corrisposto regolarmente le prestazioni di legge. Dopo l'intervento artroscopico diagnostico con microfratture del talo laterale del settembre 2023 il caso è giunto a chiusura.\n\nIn diritto\nIl reddito da invalido è fissato in fr. 67'899.-, il reddito da valido in fr. 65'298.-. Il primo risulta superiore al secondo; ne consegue che il diritto a una rendita d'invalidità è negato. All'assicurato è assegnata un'indennità per menomazione dell'integrità (IMI) del 5 %.\n\nDecide\n1. Il diritto a una rendita d'invalidità è negato.\n2. È assegnata un'IMI del 5 %.\n\nVoie di diritto\nContro la presente decisione può essere interposta opposizione scritta e motivata presso l'INSAI entro 30 giorni dalla notifica (art. 52 LPGA).\n\nINSAI – Servizio prestazioni\n____", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S5_objection", "S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Alla chiusura del caso, con decisione formale del 24 giugno 2024 l'amministrazione ha negato il diritto a una rendita in quanto il reddito da invalido (fr. 67'899.-) è risultato superiore a quello da valido (fr. 65'298.-)."}}, {"doc_id": "D09", "type": "letter", "title": "Osservazioni dell'Ufficio federale della sanità pubblica", "author": "Ufficio federale della sanità pubblica (UFSP), Divisione Assicurazione contro gli infortuni", "recipient": "Tribunale federale, III Corte di diritto sociale", "date": "2025-11-14", "reference": "Procedura 8C_254/2025", "body": "UFFICIO FEDERALE DELLA SANITÀ PUBBLICA (UFSP)\nDivisione Assicurazione contro gli infortuni\n3003 Berna\n\nBerna, 14 novembre 2025\n\nTribunale federale\nIII Corte di diritto sociale\n1000 Losanna 14\n\nProcedura 8C_254/2025 – INSAI contro A.________\nOsservazioni al ricorso in materia di diritto pubblico\n\nSignora Presidente, signori giudici,\n\nin risposta all'invito del Tribunale federale a presentare osservazioni nella causa in oggetto, concernente la sentenza del 24 marzo 2025 del Tribunale delle assicurazioni del Cantone Ticino, lo scrivente Ufficio si esprime come segue.\n\nL'UFSP si associa alla richiesta dell'assicurato e propone la reiezione del ricorso presentato dall'INSAI. Le argomentazioni a sostegno di tale posizione sono esposte nella parte seguente del presente scritto.\n\nL'Ufficio resta a disposizione del Tribunale per ogni ulteriore chiarimento.\n\nCon osservanza.\n\nUFFICIO FEDERALE DELLA SANITÀ PUBBLICA\nDivisione Assicurazione contro gli infortuni\n(firmato) ____", "ground_truth": {"status": "trap", "step_created": "S7_federal_appeal", "use_at_steps": [], "trap_type": "T1_future", "trap_note": "Scritto datato 14 novembre 2025, posteriore alla sentenza cantonale del 24 marzo 2025 e alla fase cantonale: se collocato prima della sentenza cantonale (o prima del ricorso federale) è un documento dal futuro; l'indizio è la data e il numero di procedura federale 8C_254/2025 non ancora attribuito.", "source_sentence": null}}, {"doc_id": "D10", "type": "medical_report", "title": "Referto di risonanza magnetica nucleare (RMN) della caviglia sinistra", "author": "Servizio di radiologia, ____", "recipient": "Medico curante di A.________", "date": "2022-05-19", "reference": "Esame RMN n. ____", "body": "SERVIZIO DI RADIOLOGIA\n____\n\nReferto RMN – caviglia sinistra\nData dell'esame: 19 maggio 2022\nPaziente: A.________, nato nel 1985\nIndicazione: trauma distorsivo alla caviglia sinistra del 25 marzo 2022\n\nReperti\n- Lesione della sindesmosi tibio-fibulare anteriore.\n- Distrazione del legamento deltoideo.\n- Edema osseo dell'astragalo e, in misura minore, della tibia.\n- Piccolo danno osteocondrale del domo astragalico.\n\nIl presente referto descrive i reperti di imaging. La valutazione clinica e la scelta del trattamento spettano al medico curante.\n\nDistinti saluti.\n\nDott. ____\nMedico radiologo\n(firmato)", "ground_truth": {"status": "real", "step_created": "S2_inquiry", "use_at_steps": ["S4_decision", "S6_cantonal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "L'esame di RMN del 19 maggio 2022 ha evidenziato la presenza di una lesione della sindesmosi tibio-fibulare anteriore e distrazione del legamento deltoideo, come pure un edema osseo dell'astragalo e in misura minore della tibia con piccolo danno osteocondrale del domo astragalico."}}, {"doc_id": "D11", "type": "decision", "title": "Decisione su opposizione", "author": "INSAI, Servizio giuridico", "recipient": "A.________, ____", "date": "2024-09-09", "reference": "Sinistro n. 61.2022.4417-8", "body": "ISTITUTO NAZIONALE SVIZZERO DI ASSICURAZIONE CONTRO GLI INFORTUNI (INSAI)\nServizio giuridico\n\nDecisione su opposizione del 9 settembre 2024\n\nAssicurato: A.________, nato nel 1985, n. AVS 756.____.____.__\nDatore di lavoro: B.________ SA, U.________ (TI)\nEvento: infortunio del 25 marzo 2022\n\nIn fatto\nCon decisione formale del 24 giugno 2024 l'istituto ha negato il diritto a una rendita d'invalidità e ha assegnato un'IMI del 5 %. Contro tale decisione l'assicurato ha interposto opposizione il 22 luglio 2024.\n\nIn diritto\nL'istituto conferma in sostanza il contenuto della prima decisione. Facendo capo agli ultimi dati a disposizione relativi all'evoluzione nominale dei salari, il reddito da invalido è tuttavia fissato in fr. 68'236.19. Il reddito da valido resta di fr. 65'298.-. Il reddito da invalido risulta superiore a quello da valido: il diritto a una rendita è negato. L'IMI del 5 % è confermata.\n\nDecide\nL'opposizione è respinta nel senso dei considerandi; la decisione del 24 giugno 2024 è confermata, con la correzione del reddito da invalido.\n\nVoie di diritto\nContro la presente decisione può essere interposto ricorso al Tribunale delle assicurazioni del Cantone Ticino entro 30 giorni dalla notifica (art. 56 e 60 LPGA).\n\nINSAI – Servizio giuridico\n____", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S6_cantonal_appeal", "S6b_cantonal_judgment", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "A seguito dell'opposizione interposta da A.________, in data 9 settembre 2024 l'assicuratore ha in sostanza confermato il contenuto della sua prima decisione, fissando tuttavia il reddito da invalido in fr. 68'236.19 facendo capo agli ultimi dati a disposizione relativi all'evoluzione nominale dei salari."}}, {"doc_id": "D12", "type": "inquiry_report", "title": "Calcolo del grado d'invalidità – nota interna al dossier", "author": "INSAI, Servizio prestazioni", "recipient": "Incarto A.________", "date": "2024-05-15", "reference": "Sinistro n. 61.2022.4417-8", "body": "INSAI – Servizio prestazioni\nAgenzia di ____\n\nNota al dossier del 15 maggio 2024\n\nAssicurato: A.________, nato nel 1985\nDatore di lavoro: B.________ SA, U.________ (TI)\nEvento: infortunio del 25 marzo 2022, trauma distorsivo alla caviglia sinistra\n\nStato del caso\nIl caso è stato assunto dall'istituto. L'assicurato è stato sottoposto nel settembre 2023 a un intervento artroscopico diagnostico con microfratture del talo laterale. Le prestazioni di legge sono state versate regolarmente.\n\nCalcolo preliminare\nReddito da valido: fr. 65'298.-\nReddito da invalido: fr. 66'950.-\nIl reddito da invalido risulta superiore al reddito da valido. Indennità per menomazione dell'integrità: 5 %.\n\nProssimi passi\nIl caso sarà sottoposto al Servizio prestazioni per la decisione formale. I redditi indicati dovranno essere verificati in base ai dati salariali più recenti.\n\nRedatto da: ____, collaboratore Servizio prestazioni\nVisto: ____", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": [], "trap_type": "T2_superseded", "trap_note": "Calcolo preliminare anteriore alla decisione del 24 giugno 2024: il reddito da invalido (fr. 66'950.-) differisce da quelli poi fissati (fr. 67'899.- e fr. 68'236.19) e la nota stessa rinvia a una verifica successiva.", "source_sentence": null}}, {"doc_id": "D13", "type": "appeal", "title": "Ricorso al Tribunale delle assicurazioni del Cantone Ticino", "author": "A.________", "recipient": "Tribunale delle assicurazioni del Cantone Ticino", "date": "2024-10-07", "reference": "Sinistro n. 61.2022.4417-8", "body": "Raccomandata n. RA 98.00.5318 7741.2\n\nTribunale delle assicurazioni del Cantone Ticino\n____\n\n____, 7 ottobre 2024\n\nRicorso\n\nricorrente: A.________, nato nel 1985, ____\ncontro\nla decisione su opposizione del 9 settembre 2024 dell'Istituto nazionale svizzero di assicurazione contro gli infortuni (INSAI)\n\nConclusioni\nChiedo che la decisione su opposizione del 9 settembre 2024 sia riformata e che mi sia riconosciuto il diritto a una rendita d'invalidità.\n\nIn fatto\nIl 25 marzo 2022, mentre ero alle dipendenze della B.________ SA di U.________ (TI) in qualità di piastrellista, ho riportato un trauma distorsivo alla caviglia sinistra. Nel settembre 2023 sono stato sottoposto a un intervento artroscopico diagnostico con microfratture del talo laterale. Con decisione su opposizione l'INSAI ha confermato il diniego della rendita, fissando il reddito da invalido in fr. 68'236.19 e quello da valido in fr. 65'298.-, e l'IMI nella misura del 5 %.\n\nContesto l'esito del confronto dei redditi operato dall'istituto. Il ricorso è presentato entro il termine di 30 giorni (art. 60 LPGA).\n\nCon osservanza.\n\n(firmato) A.________\n\nAllegato: decisione su opposizione del 9 settembre 2024.", "ground_truth": {"status": "real", "step_created": "S6_cantonal_appeal", "use_at_steps": ["S6b_cantonal_judgment", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "B. Con sentenza del 24 marzo 2025, il Tribunale delle assicurazioni del Cantone Ticino ha parzialmente accolto il ricorso interposto dall'assicurato"}}], "absent_document": {"type": "medical_report", "description": "Rapporto di esame medico finale (medico di circondario INSAI o perizia indipendente) sulla capacità lavorativa residua dell'assicurato e sulle attività esigibili dopo l'intervento al talo.", "why_decisive": "I fatti non menzionano alcuna valutazione medica della capacità lavorativa residua, ma il reddito da invalido e il confronto dei redditi, quindi il diritto alla rendita, dipendono interamente da essa.", "needed_at_step": "S6_cantonal_appeal"}, "questions": [{"step_index": 0, "after_step": "S1_claim", "visible_doc_ids": ["D04", "D05", "D09", "D10"], "gold": {"next_step": "S2_inquiry", "next_action": "L'esame di RMN del 19 maggio 2022 documenta le lesioni della ca  Kantons Zürich schreibt das Verfahren wegen Gegenstandslosigkeit ab.", "deadline_rule": null}, {"code": "S4_decision", "date": "2020-05-19", "actor": "iv_office", "act": "Die IV-Stelle fordert von B.________ die für 1. Juli 2013 bis 31. August 2017 ausgerichteten Kinderrenten zurück (Fr. 116'878.-).", "deadline_rule": "30 Tage ab Eröffnung, Art. 60 ATSG"}, {"code": "S6b_cantonal_judgment", "date": "2021-05-05", "actor": "cantonal_court", "act": "Das Sozialversicherungsgericht heisst die Beschwerde von B.________ gut und stellt fest, die Kinderrenten seien nicht zu Unrecht bezogen worden; das Urteil wird auch A.________ eröffnet, der nicht beigeladen war, und bleibt unangefochten.", "deadline_rule": "30 Tage ab Eröffnung, Art. 100 BGG"}, {"code": "S3_pre_decision", "date": "2021-09-02", "actor": "iv_office", "act": "Die IV-Stelle kündigt A.________ die Rückforderung der Kinderrenten für 1. Juli 2013 bis 31. August 2017 an.", "deadline_rule": "30 Tage für Einwand, Art. 57a IVG"}, {"code": "S4_decision", "date": "2023-03-21", "actor": "iv_office", "act": "Die IV-Stelle hält an der Rückforderung gegenüber A.________ in Höhe von Fr. 96'617.80 fest und fordert gleichentags von der AXA Fr. 18'205.20 zurück.", "deadline_rule": "30 Tage ab Eröffnung, Art. 60 ATSG"}, {"code": "S6_cantonal_appeal", "date": null, "actor": "insured", "act": "A.________ lässt gegen die Verfügung vom 21. März 2023 Beschwerde beim Sozialversicherungsgericht erheben; die AXA wird beigeladen und lässt sich nicht vernehmen.", "deadline_rule": "30 Tage ab Eröffnung, Art. 60 ATSG"}, {"code": "S6b_cantonal_judgment", "date": "2025-06-30", "actor": "cantonal_court", "act": "Das Sozialversicherungsgericht weist die Beschwerde von A.________ ab.", "deadline_rule": "30 Tage ab Eröffnung, Art. 100 BGG"}, {"code": "S7_federal_appeal", "date": null, "actor": "insured", "act": "A.________ lässt Beschwerde in öffentlich-rechtlichen Angelegenheiten erheben und beantragt die Aufhebung des Urteils vom 30. Juni 2025 und der Verfügung vom 21. März 2023; IV-Stelle schliesst auf Abweisung, das BSV stellt keinen Antrag.", "deadline_rule": "30 Tage ab Eröffnung, Art. 100 BGG"}], "documents": [{"doc_id": "D01", "type": "decision", "title": "Verfügung betreffend Rückforderung von Kinderrenten", "author": "IV-Stelle des Kantons Zürich", "recipient": "A.________", "date": "2023-03-21", "reference": "IV-Stelle ZH / Dossier ____ / Verf. 2023-0321", "body": "IV-Stelle des Kantons Zürich, ____strasse __, ____ Zürich\nEinschreiben\nA.________, ____\n\nVerfügung\nBetreff: Rückforderung von Kinderrenten für die Zeit vom 1. Juli 2013 bis 31. August 2017\n\nNach Durchführung des Vorbescheidverfahrens (Vorbescheid vom 2. September 2021) verfügt die IV-Stelle des Kantons Zürich:\n\n1. Die Kinderrenten, die für die Zeit vom 1. Juli 2013 bis 31. August 2017 ausgerichtet wurden, sind zurückzuerstatten. Die Rückforderung gegenüber A.________ beläuft sich auf Fr. 96'617.80.\n2. Die Verfügungen vom 22. Januar 2020 betreffend Kinderrenten haben die Kindsmutter B.________ nicht erreicht. Das Urteil des Sozialversicherungsgerichts des Kantons Zürich vom 5. Mai 2021 ist unangefochten geblieben.\n3. Gleichentags werden von der AXA Versicherungen AG die ausgerichteten Leistungen im Umfang von Fr. 18'205.20 zurückgefordert.\n\nRechtsmittelbelehrung: Gegen diese Verfügung kann innert 30 Tagen seit der Eröffnung beim Sozialversicherungsgericht des Kantons Zürich, ____, schriftlich Beschwerde erhoben werden (Art. 56 und 60 ATSG). Die Beschwerdeschrift hat einen Antrag und eine Begründung zu enthalten; die Beweismittel sind zu bezeichnen, soweit möglich beizulegen. Der angefochtene Entscheid ist beizulegen.\n\nIV-Stelle des Kantons Zürich\n____\nKopie an: AXA Versicherungen AG", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Verfügung vom 21. März 2023 hielt sie an der Rückforderung in der Höhe von Fr. 96'617.80 fest. Gleichentags forderte sie von der AXA die ausgerichteten Leistungen im Umfang von Fr. 18'205.20 zurück."}}, {"doc_id": "D02", "type": "letter", "title": "Stellungnahme des Bundesamtes für Sozialversicherungen", "author": "Bundesamt für Sozialversicherungen (BSV), Geschäftsfeld Invalidenversicherung", "recipient": "Schweizerisches Bundesgericht, I. sozialrechtliche Abteilung, Luzern", "date": "2025-10-14", "reference": "BSV 318.-/2025 / BGer 8C_484/2025", "body": "Bundesamt für Sozialversicherungen BSV\nEffingerstrasse 20, 3003 Bern\n\nAn das Schweizerische Bundesgericht\nI. sozialrechtliche Abteilung\n____, Luzern\n\nBeschwerdeverfahren 8C_484/2025\nA.________ gegen IV-Stelle des Kantons Zürich und AXA Versicherungen AG\n\nSehr geehrte Damen und Herren\n\nMit Schreiben vom ____ haben Sie dem Bundesamt für Sozialversicherungen Gelegenheit gegeben, sich zur Beschwerde in öffentlich-rechtlichen Angelegenheiten gegen das Urteil des Sozialversicherungsgerichts des Kantons Zürich vom 30. Juni 2025 zu äussern.\n\nDas BSV nimmt dazu wie folgt Stellung:\n\n1. Streitig ist die Rückforderung der Kinderrenten, die für den Zeitraum vom 1. Juli 2013 bis zum 31. August 2017 ausgerichtet worden sind. Die IV-Stelle hat mit Verfügung vom 21. März 2023 an der Rückforderung in der Höhe von Fr. 96'617.80 festgehalten.\n2. Die Vorinstanz und die IV-Stelle haben auf eine Vernehmlassung verzichtet; die IV-Stelle hat auf Abweisung der Beschwerde geschlossen.\n3. Das BSV äussert sich zur Sache, ohne einen Antrag zu stellen. Es verweist auf die einschlägigen Weisungen zur Kinderrente und zur Rückerstattung unrechtmässig bezogener Leistungen.\n\nWir danken Ihnen für die Kenntnisnahme und verbleiben mit freundlichen Grüssen\n\nBundesamt für Sozialversicherungen\nGeschäftsfeld Invalidenversicherung\n____ (Unterschrift)\n\nKopie an: IV-Stelle des Kantons Zürich", "ground_truth": {"status": "trap", "step_created": "S7_federal_appeal", "use_at_steps": [], "trap_type": "T1_future", "trap_note": "Die Stellungnahme des BSV ist auf 2025-10-14 datiert und gehört ins Bundesgerichtsverfahren; im Schritt S6_cantonal_appeal existiert sie noch nicht und verweist auf das kantonale Urteil vom 30. Juni 2025.", "source_sentence": null}}, {"doc_id": "D03", "type": "decision", "title": "Verfügung betreffend Rückforderung von Kinderrenten", "author": "IV-Stelle des Kantons Zürich", "recipient": "B.________", "date": "2020-05-19", "reference": "IV-Stelle ZH / Dossier ____ / Verf. 2020-0519", "body": "IV-Stelle des Kantons Zürich, ____strasse __, ____ Zürich\nEinschreiben\nB.________, ____\n\nVerfügung\nBetreff: Rückforderung von Kinderrenten für die Zeit vom 1. Juli 2013 bis 31. August 2017\n\nDie IV-Stelle des Kantons Zürich verfügt:\n\n1. Mit Verfügungen vom 22. Januar 2020 wurde die Ausrichtung der Kinderrenten für den Zeitraum vom 1. Juli 2013 bis zum 31. August 2017 an A.________ verfügt, nachdem dieser gegen die früheren Verfügungen Beschwerde erhoben hatte.\n2. Die für den Zeitraum vom 1. Juli 2013 bis zum 31. August 2017 an B.________ ausgerichteten Kinderrenten werden von dieser zurückgefordert. Der Rückforderungsbetrag beläuft sich auf Fr. 116'878.-.\n3. Einer allfälligen Beschwerde gegen diese Verfügung kommt keine aufschiebende Wirkung zu, soweit nicht anders entschieden wird.\n\nRechtsmittelbelehrung: Gegen diese Verfügung kann innert 30 Tagen seit der Eröffnung beim Sozialversicherungsgericht des Kantons Zürich, ____, schriftlich Beschwerde erhoben werden (Art. 56 und 60 ATSG). Die Beschwerde muss einen Antrag und eine Begründung enthalten; die Beweismittel sind zu bezeichnen und, soweit möglich, beizulegen.\n\nIV-Stelle des Kantons Zürich\n____", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Verfügung vom 19. Mai 2020 forderte die IV-Stelle die für den Zeitraum vom 1. Juli 2013 bis zum 31. August 2017 an B.________ ausgerichteten Kinderrenten von dieser zurück (Fr. 116'878.-)."}}, {"doc_id": "D04", "type": "statute_extract", "title": "Auszug aus dem Bundesgesetz über den Allgemeinen Teil des Sozialversicherungsrechts (ATSG), Art. 25", "author": "Fedlex / Systematische Sammlung des Bundesrechts (SR 830.1)", "recipient": "Dossier", "date": "2019-01-01", "reference": "SR 830.1, Art. 25 (Stand am 1. Januar 2019)", "body": "Bundesgesetz über den Allgemeinen Teil des Sozialversicherungsrechts (ATSG)\nSR 830.1\nStand am 1. Januar 2019\n\nArt. 25 Rückforderung\n\n1 Unrechtmässig bezogene Leistungen sind zurückzuerstatten. Wer die Leistungen in gutem Glauben empfangen hat, muss sie nicht zurückerstatten, wenn eine grosse Härte vorliegt.\n\n2 Der Rückforderungsanspruch erlischt mit dem Ablauf eines Jahres, nachdem die Versicherungseinrichtung davon Kenntnis erhalten hat, spätestens aber mit dem Ablauf von fünf Jahren nach der Entrichtung der einzelnen Leistung. Wird der Rückforderungsanspruch aus einer Straftat abgeleitet, für die das Strafrecht eine längere Verjährungsfrist vorsieht, so ist diese Frist massgebend.\n\n3 Der Bundesrat kann bestimmen, dass auf die Rückforderung unrechtmässig bezogener Leistungen von geringem Betrag verzichtet wird.\n\nAnmerkung: Dieser Auszug gibt den Wortlaut der Bestimmung wieder, wie er im Bundesrecht am Stichtag veröffentlicht war. Massgebend ist die amtliche Veröffentlichung in der Amtlichen Sammlung des Bundesrechts (AS) und im Bundesblatt (BBl). Die Fassung wurde für das Dossier im Rahmen der Aktenführung der IV-Stelle ausgedruckt und zu den Akten genommen.\n\nQuelle: www.fedlex.admin.ch, abgerufen für die interne Dokumentation.", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": [], "trap_type": "T5_wrong_law_version", "trap_note": "Der Auszug trägt den Stand 1. Januar 2019, also die vor der ATSG-Revision per 1. Januar 2021 geltende Fassung von Art. 25, und nicht die am Verfügungsdatum 21. März 2023 geltende Fassung; der Wortlaut ist vor Verwendung gegen die Fassung am Entscheidstichtag zu prüfen.", "source_sentence": null}}, {"doc_id": "D05", "type": "appeal", "title": "Beschwerde gegen die Verfügungen vom 15. August, 26. September und 24. Oktober 2019", "author": "A.________ (handelnd durch seinen Rechtsvertreter)", "recipient": "Sozialversicherungsgericht des Kantons Zürich", "date": "2019-11-22", "reference": "SVG ZH, Beschwerde-Eingang 2019 / IV 2019/____", "body": "An das Sozialversicherungsgericht des Kantons Zürich\n____strasse __, ____ Zürich\n\nEinschreiben, Nr. ____\n\nBeschwerde\n\nder A.________, ____, geboren 1970\nvertreten durch ____\n\ngegen die IV-Stelle des Kantons Zürich, ____strasse __, ____ Zürich\n\nbetreffend Kinderrenten (Verfügungen vom 15. August, 26. September und 24. Oktober 2019)\n\nRechtsbegehren:\nDie Nachzahlung der Kinderrenten sei für den Zeitraum vom 1. Juli 2013 bis zum Zeitpunkt der Aufhebung des gemeinsamen Haushaltes am 24. August 2017 zuzüglich Zins an den Beschwerdeführer auszurichten.\n\nBegründung:\n1. Sachverhalt: Der Beschwerdeführer bezieht seit dem 1. Juli 2013 eine Invalidenrente. Die IV-Stelle hat die laufenden Rentenbetreffnisse und die Nachzahlungen der Kinderrenten an die seit dem 24. August 2017 von ihm getrennt lebende Mutter der drei gemeinsamen Kinder ausgerichtet; die Kinder stehen in deren alleiniger Obhut.\n2. Formelles: Die angefochtenen Verfügungen wurden dem Beschwerdeführer innert der Beschwerdefrist von 30 Tagen vor Einreichung dieser Beschwerde eröffnet. Der Beschwerdeführer ist als Adressat der Verfügungen zur Beschwerde legitimiert (Art. 59 ATSG).\n3. Die weitere Begründung bleibt der Beschwerdeergänzung vorbehalten.\n\nBeilagen: Verfügungen der IV-Stelle; Vollmacht.\n\nFreundliche Grüsse\n____ (Rechtsvertreter)\nEingang beim Gericht: Stempel ____", "ground_truth": {"status": "real", "step_created": "S6_cantonal_appeal", "use_at_steps": ["S6_cantonal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Beschwerde beantragte A.________, die Nachzahlung der Kinderrenten sei für den Zeitraum vom 1. Juli 2013 bis zum Zeitpunkt der Aufhebung des gemeinsamen Haushaltes am 24. August 2017 zuzüglich Zins an ihn auszurichten."}}, {"doc_id": "D06", "type": "judgment", "title": "Urteil des Sozialversicherungsgerichts des Kantons Zürich", "author": "Sozialversicherungsgericht des Kantons Zürich, ____ Kammer", "recipient": "A.________; IV-Stelle des Kantons Zürich; AXA Versicherungen AG", "date": "2025-06-30", "reference": "SVG ZH IV.2023.____", "body": "Sozialversicherungsgericht des Kantons Zürich\nIV.2023.____\n\nUrteil vom 30. Juni 2025\n\nin Sachen\nA.________, Beschwerdeführer\nvertreten durch ____\n\ngegen\nIV-Stelle des Kantons Zürich, Beschwerdegegnerin\n\nund\nAXA Versicherungen AG, Beigeladene\n\nSachverhalt:\nA. Die IV-Stelle sprach A.________ mit Verfügungen vom 26. September und 24. Oktober 2019 Renten zu und richtete die Kinderrenten an die getrennt lebende Mutter der Kinder aus. Mit Verfügungen vom 22. Januar 2020 verfügte sie die Ausrichtung der Kinderrenten für die Zeit vom 1. Juli 2013 bis zum 31. August 2017 an A.________. Mit Urteil vom 5. Mai 2021 stellte das Gericht fest, die an B.________ ausgerichteten Kinderrenten seien nicht zu Unrecht bezogen worden.\nB. Mit Verfügung vom 21. März 2023 hielt die IV-Stelle an der Rückforderung in der Höhe von Fr. 96'617.80 fest. Dagegen liess A.________ Beschwerde erheben. Die zum Verfahren beigeladene AXA liess sich nicht vernehmen.\n\nDas Gericht beschliesst:\nDie Beschwerde wird abgewiesen.\n\nRechtsmittelbelehrung: Gegen dieses Urteil kann innert 30 Tagen seit der Eröffnung beim Schweizerischen Bundesgericht, ____, Luzern, Beschwerde in öffentlich-rechtlichen Angelegenheiten erhoben werden (Art. 82 ff. und 100 BGG). Die Beschwerdeschrift hat die Begehren, deren Begründung mit Angabe der Beweismittel und die Unterschrift zu enthalten.\n\nIm Namen des Gerichts\nDie Vorsitzende / Der Gerichtsschreiber: ____", "ground_truth": {"status": "real", "step_created": "S6b_cantonal_judgment", "use_at_steps": ["S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Urteil vom 30. Juni 2025 wies das Sozialversicherungsgericht die Beschwerde des A.________ ab."}}, {"doc_id": "D07", "type": "letter", "title": "Stellungnahme der Beigeladenen zur Beschwerde", "author": "AXA Versicherungen AG, Leistungen Krankentaggeld", "recipient": "Sozialversicherungsgericht des Kantons Zürich", "date": "2023-06-05", "reference": "AXA Schaden-Nr. ____ / SVG ZH IV.2023.____", "body": "AXA Versicherungen AG\nLeistungen Krankentaggeld\n____strasse __, ____ Winterthur\n\nAn das Sozialversicherungsgericht des Kantons Zürich\n____strasse __, ____ Zürich\n\nBeschwerdeverfahren A.________ gegen IV-Stelle des Kantons Zürich\nBetreff: Stellungnahme der Beigeladenen\n\nSehr geehrte Damen und Herren\n\nMit Verfügung vom ____ haben Sie die AXA Versicherungen AG zum obengenannten Beschwerdeverfahren beigeladen. Wir nehmen dazu wie folgt Stellung:\n\n1. Die AXA hat als Krankentaggeldversicherung von A.________ Vorleistungen erbracht.\n2. Die IV-Stelle hat einen Teil der Nachzahlungen der Kinderrenten für die Zeit vom 1. Juli 2013 bis 31. August 2017 an die AXA überwiesen.\n3. Mit Verfügung vom 21. März 2023 hat die IV-Stelle von der AXA die ausgerichteten Leistungen im Umfang von Fr. 18'205.20 zurückgefordert.\n4. Wir bitten das Gericht, bei seinem Entscheid die Stellung der AXA als Vorleistungserbringerin zu berücksichtigen und uns den Entscheid zuzustellen.\n\nWir danken Ihnen für die Kenntnisnahme.\n\nFreundliche Grüsse\n\nAXA Versicherungen AG\n\n_______________________          _______________________\n\nBeilagen: Verfügung der IV-Stelle vom 21. März 2023", "ground_truth": {"status": "trap", "step_created": "S6_cantonal_appeal", "use_at_steps": [], "trap_type": "T3_unsent", "trap_note": "Das Schreiben ist nicht unterzeichnet (leere Unterschriftsfelder), ohne Einschreibenummer und Eingangsstempel, und die Beschwerde-Akten halten fest, dass sich die beigeladene AXA nicht vernehmen liess, also nie eine Stellungnahme einging.", "source_sentence": null}}, {"doc_id": "D08", "type": "judgment", "title": "Urteil des Sozialversicherungsgerichts des Kantons Zürich in Sachen B.________", "author": "Sozialversicherungsgericht des Kantons Zürich, ____ Kammer", "recipient": "B.________; IV-Stelle des Kantons Zürich; zur Kenntnis: A.________", "date": "2021-05-05", "reference": "SVG ZH IV.2020.____", "body": "Sozialversicherungsgericht des Kantons Zürich\nIV.2020.____\n\nUrteil vom 5. Mai 2021\n\nin Sachen\nB.________, Beschwerdeführerin\nvertreten durch ____\n\ngegen\nIV-Stelle des Kantons Zürich, Beschwerdegegnerin\n\nSachverhalt:\nMit Verfügung vom 19. Mai 2020 forderte die IV-Stelle die für den Zeitraum vom 1. Juli 2013 bis zum 31. August 2017 an B.________ ausgerichteten Kinderrenten von dieser zurück (Fr. 116'878.-). Dagegen erhob B.________ Beschwerde.\n\nDas Gericht beschliesst:\n1. Die Beschwerde wird gutgeheissen. Es wird festgestellt, dass die für den Zeitraum vom 1. Juli 2013 bis 31. August 2017 ausgerichteten Kinderrenten nicht zu Unrecht bezogen wurden und folglich nicht zurückzuerstatten sind.\n2. Das Urteil wird den Parteien sowie A.________ eröffnet.\n\nHinweis zur Eröffnung: A.________ wurde nicht zum Verfahren beigeladen; ihm wird das Urteil lediglich zur Kenntnis eröffnet.\n\nRechtsmittelbelehrung: Gegen dieses Urteil kann innert 30 Tagen seit der Eröffnung beim Schweizerischen Bundesgericht, ____, Luzern, Beschwerde in öffentlich-rechtlichen Angelegenheiten erhoben werden (Art. 82 ff. und 100 BGG). Die Beschwerdeschrift hat die Begehren, deren Begründung mit Angabe der Beweismittel und die Unterschrift zu enthalten.\n\nIm Namen des Gerichts\nDie Vorsitzende / Der Gerichtsschreiber: ____", "ground_truth": {"status": "real", "step_created": "S6b_cantonal_judgment", "use_at_steps": ["S3_pre_decision", "S4_decision", "S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Die von B.________ dagegen erhobene Beschwerde hiess das Sozialversicherungsgericht des Kantons Zürich mit Urteil vom 5. Mai 2021 gut. Es stellte fest, die für den Zeitraum vom 1. Juli 2013 bis 31. August 2017 ausgerichteten Kinderrenten seien nicht zu Unrecht bezogen worden und folglich nicht zurückzuerstatten. Es eröffnete das Urteil auch A.________, ohne diesen aber vorgängig zum Verfahren beigeladen zu haben."}}, {"doc_id": "D09", "type": "decision", "title": "Verfügung betreffend Rückforderung von Kinderrenten", "author": "IV-Stelle des Kantons Zürich", "recipient": "A.________", "date": "2023-03-21", "reference": "IV-Stelle ZH / Dossier ____ / Verf. 2023-0321", "body": "IV-Stelle des Kantons Zürich, ____strasse __, ____ Zürich\nEinschreiben\nA.________, geboren 1968, AHV-Nr. 756.4821.7305.14\n____\n\nVerfügung\nBetreff: Rückforderung von Kinderrenten für die Zeit vom 1. Januar 2014 bis 30. Juni 2017\n\nDie IV-Stelle des Kantons Zürich verfügt:\n\n1. Die Kinderrente, die für die Zeit vom 1. Januar 2014 bis zum 30. Juni 2017 für das gemeinsame Kind ausgerichtet wurde, ist zurückzuerstatten. Die Rückforderung gegenüber A.________ beläuft sich auf Fr. 41'290.-.\n2. Die Kindsmutter wurde über das Ergebnis der Überprüfung ihrerseits informiert. Ein Urteil des Sozialversicherungsgerichts liegt in diesem Verfahren nicht vor.\n3. Die Rückforderung erfolgt, nachdem die Voraussetzungen für den Bezug der Kinderrente durch die Versicherungseinrichtung neu beurteilt wurden.\n\nRechtsmittelbelehrung: Gegen diese Verfügung kann innert 30 Tagen seit der Eröffnung beim Sozialversicherungsgericht des Kantons Zürich, ____, schriftlich Beschwerde erhoben werden (Art. 56 und 60 ATSG). Die Beschwerdeschrift hat einen Antrag und eine Begründung zu enthalten; die Beweismittel sind zu bezeichnen und, soweit möglich, beizulegen.\n\nIV-Stelle des Kantons Zürich\n____", "ground_truth": {"status": "trap", "step_created": "S4_decision", "use_at_steps": [], "trap_type": "T4_wrong_person", "trap_note": "Verfügung betrifft eine andere versicherte Person mit gleichem Namenskürzel: Geburtsjahr 1968 statt 1970, eigene AHV-Nummer, anderer Zeitraum (1.1.2014–30.6.2017) und anderer Betrag (Fr. 41'290.-).", "source_sentence": null}}, {"doc_id": "D10", "type": "decision", "title": "Verfügung betreffend Rente und Kinderrenten", "author": "IV-Stelle des Kantons Zürich", "recipient": "A.________", "date": "2019-10-24", "reference": "IV-Stelle ZH / Dossier ____ / Verf. 2019-1024", "body": "IV-Stelle des Kantons Zürich, ____strasse __, ____ Zürich\nEinschreiben\nA.________, ____\n\nVerfügung\nBetreff: Rentenanspruch von A.________, geboren 1970; Kinderrenten\n\nDie IV-Stelle des Kantons Zürich verfügt (in Ergänzung zur Verfügung vom 26. September 2019):\n\n1. Ab 1. Juli 2013 besteht Anspruch auf eine ganze Invalidenrente.\n2. Ab 1. November 2013 besteht Anspruch auf eine halbe Invalidenrente.\n3. Ab 1. Februar 2015 besteht wiederum Anspruch auf eine ganze Invalidenrente.\n4. Für die Zeit der IV-Taggeldzahlungen wird ein Rentenanspruch verneint.\n5. Die Rente wird vom 1. Dezember 2017 bis Ende Februar 2018 sistiert, da sich A.________ im Strafvollzug befand.\n6. Für die drei gemeinsamen Kinder werden Kinderrenten gewährt. Die laufenden Rentenbetreffnisse sowie die Nachzahlungen der Kinderrenten werden an die von A.________ seit dem 24. August 2017 getrennt lebende Mutter der Kinder ausgerichtet, die die alleinige Obhut innehat (vgl. Verfügungen vom 15. August und 26. September 2019).\n\nRechtsmittelbelehrung: Gegen diese Verfügung kann innert 30 Tagen seit der Eröffnung beim Sozialversicherungsgericht des Kantons Zürich, ____, schriftlich Beschwerde erhoben werden (Art. 56 und 60 ATSG). Die Beschwerdeschrift hat einen Antrag und eine Begründung zu enthalten; die Beweismittel sind zu bezeichnen und, soweit möglich, beizulegen.\n\nIV-Stelle des Kantons Zürich\n____", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S6_cantonal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Mit Verfügungen vom 26. September und 24. Oktober 2019 sprach die IV-Stelle des Kantons Zürich dem 1970 geborenen A.________ ab 1. Juli 2013 eine ganze, ab 1. November 2013 eine halbe und ab 1. Februar 2015 wiederum eine ganze Invalidenrente zu, wobei sie einen Rentenanspruch während der Zeit der IV-Taggeldzahlungen verneinte."}}, {"doc_id": "D11", "type": "appeal", "title": "Beschwerde gegen die Verfügung vom 21. März 2023", "author": "A.________ (handelnd durch seinen Rechtsvertreter)", "recipient": "Sozialversicherungsgericht des Kantons Zürich", "date": "2023-04-24", "reference": "SVG ZH, Beschwerde-Eingang 2023 / IV 2023/____", "body": "An das Sozialversicherungsgericht des Kantons Zürich\n____strasse __, ____ Zürich\n\nEinschreiben, Nr. ____\n\nBeschwerde\n\nder A.________, ____, geboren 1970\nvertreten durch ____\n\ngegen die IV-Stelle des Kantons Zürich, ____strasse __, ____ Zürich\n\nbetreffend Rückforderung von Kinderrenten (Verfügung vom 21. März 2023)\n\nRechtsbegehren:\nDie Verfügung der IV-Stelle vom 21. März 2023 sei aufzuheben.\n\nBegründung:\n1. Sachverhalt: Mit Verfügung vom 21. März 2023 hat die IV-Stelle an der Rückforderung der für den Zeitraum vom 1. Juli 2013 bis zum 31. August 2017 ausgerichteten Kinderrenten in der Höhe von Fr. 96'617.80 festgehalten. Zuvor hatte sie mit Vorbescheid vom 2. September 2021 die Rückforderung angekündigt. Das Urteil des Sozialversicherungsgerichts vom 5. Mai 2021 war dem Beschwerdeführer eröffnet worden, ohne dass er vorgängig zum Verfahren beigeladen worden war; es ist unangefochten geblieben.\n2. Formelles: Die Beschwerde richtet sich gegen eine Verfügung, die dem Beschwerdeführer eröffnet wurde, und erfolgt fristgerecht innert 30 Tagen (Art. 60 ATSG). Der Beschwerdeführer ist als Adressat der Verfügung zur Beschwerde legitimiert (Art. 59 ATSG).\n3. Die weitere Begründung wird in der Beschwerdeergänzung dargelegt.\n\nBeilagen: Verfügung vom 21. März 2023; Vollmacht.\n\nFreundliche Grüsse\n____ (Rechtsvertreter)\nEingang beim Gericht: Stempel ____", "ground_truth": {"status": "real", "step_created": "S6_cantonal_appeal", "use_at_steps": ["S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "A.________ liess gegen die Verfügung vom 21. März 2023 Beschwerde beim Sozialversicherungsgericht des Kantons Zürich erheben."}}, {"doc_id": "D12", "type": "decision", "title": "Verfügung betreffend Ausrichtung der Kinderrenten", "author": "IV-Stelle des Kantons Zürich", "recipient": "A.________", "date": "2020-01-22", "reference": "IV-Stelle ZH / Dossier ____ / Verf. 2020-0122", "body": "IV-Stelle des Kantons Zürich, ____strasse __, ____ Zürich\nEinschreiben\nA.________, ____\n\nVerfügung\nBetreff: Ausrichtung der Kinderrenten für die Zeit vom 1. Juli 2013 bis 31. August 2017\n\nIm hängigen Beschwerdeverfahren gegen die Verfügungen betreffend Kinderrenten kommt die IV-Stelle des Kantons Zürich auf ihre bisherigen Verfügungen zurück und verfügt:\n\n1. Dem Begehren von A.________ wird entsprochen. Die Kinderrenten werden für den Zeitraum vom 1. Juli 2013 bis zum 31. August 2017 an A.________ ausgerichtet.\n2. Ein Teil der Nachzahlungen wird an die AXA Versicherungen AG überwiesen, die als Krankentaggeldversicherung Vorleistungen erbracht hat.\n3. Die Verfügungen betreffend Kinderrenten vom 15. August, 26. September und 24. Oktober 2019 werden insoweit ersetzt.\n\nRechtsmittelbelehrung: Gegen diese Verfügung kann innert 30 Tagen seit der Eröffnung beim Sozialversicherungsgericht des Kantons Zürich, ____, schriftlich Beschwerde erhoben werden (Art. 56 und 60 ATSG). Die Beschwerde hat einen Antrag und eine Begründung zu enthalten; die Beweismittel sind zu bezeichnen und, soweit möglich, beizulegen.\n\nIV-Stelle des Kantons Zürich\n____\n\nVerteiler: A.________; AXA Versicherungen AG; Sozialversicherungsgericht des Kantons Zürich", "ground_truth": {"status": "real", "step_created": "S4_decision", "use_at_steps": ["S3_pre_decision", "S4_decision", "S6_cantonal_appeal", "S7_federal_appeal"], "trap_type": null, "trap_note": "", "source_sentence": "Während des hängigen Beschwerdeverfahrens kam die IV-Stelle auf ihre Verfügungen betreffend Kinderrente zurück und entsprach dem Begehren von A.________; sie verfügte die Ausrichtung der Kinderrenten für den Zeitraum vom 1. Juli 2013 bis zum 31. August 2017 an A.________ (Verfügungen vom 22. Januar 2020), wobei sie die neuen Verfügungen der von ihm getrennt lebenden Kindsmutter B.________ nicht eröffnete."}}, {"doc_id": "D13", "type": "decision", "title": "Verfügung betreffend Rückforderung von Kinderrenten", "author": "IV-Stelle des Kantons Zürich", "recipient": "A.________", "date": "2023-02-14", "reference": "IV-Stelle ZH / Dossier ____ / Verf. 2023-0214", "body": "IV-Stelle des Kantons Zürich, ____strasse __, ____ Zürich\nEinschreiben\nA.________, ____\n\nVerfügung\nBetreff: Rückforderung von Kinderrenten für die Zeit vom 1. Juli 2013 bis 31. August 2017\n\nNach Durchführung des Vorbescheidverfahrens (Vorbescheid vom 2. September 2021) verfügt die IV-Stelle des Kantons Zürich:\n\n1. Die Kinderrenten, die für die Zeit vom 1. Juli 2013 bis zum 31. August 2017 ausgerichtet wurden, sind zurückzuerstatten. Die Rückforderung gegenüber A.________ beläuft sich auf Fr. 116'878.-.\n2. Das Urteil des Sozialversicherungsgerichts des Kantons Zürich vom 5. Mai 2021 ist unangefochten geblieben.\n3. Der Anspruch der AXA Versicherungen AG wird separat geregelt.\n\nRechtsmittelbelehrung: Gegen diese Verfügung kann innert 30 Tagen seit der Eröffnung beim Sozialversicherungsgericht des Kantons Zürich, ____, schriftlich Beschwerde erhoben werden (Art. 56 und 60 ATSG). Die Beschwerdeschrift hat einen Antrag und eine Begründung zu enthalten; die Beweismittel sind zu bezeichnen und, soweit möglich, beizulegen.\n\nIV-
